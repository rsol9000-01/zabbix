zabbix_export:
  version: '7.4'
  template_groups:
    - uuid: 19a51f2ca0864028ba21eb9633248ac3
      name: Templates/Simovilab
  templates:
    - uuid: 1bd3323464794fb7a34a7c28791f51ce
      template: simovilab-infobus-ext
      name: simovilab-infobus-ext
      description: |
        MACDT layer I, external side. Linked to the Zabbix server host (R4) through LOCAL_TEMPLATE_*.
        The R4 agent measures the InfoBus API through Traefik and HTTPS, with the same infobus_probe.py.
        The difference against the internal measurement (network, TLS + Traefik) is in simovilab-infobus,
        which references this host by its fixed name, Zabbix-server.
        It only produces data when the API is behind Traefik.
      groups:
        - name: Templates/Simovilab
      items:
        - uuid: e7db2f710b0a4ba1bfca68365d4816f0
          name: 'External InfoBus API probe'
          type: ZABBIX_ACTIVE
          key: infobus.api.ext
          delay: 60s
          history: 1d
          value_type: TEXT
          description: 'Master item. Same infobus_probe.py, run by the R4 agent against the public domain (Traefik + HTTPS). 30 s timeout, as in the internal probe: with TLS, 10 requests and the hourly GTFS check, a run takes longer than the 3 s default.'
          timeout: 30s
        - uuid: bd9263c51f55419dbc6f816841670493
          name: 'External - internal: last hour p95'
          type: CALCULATED
          key: infobus.api.ext.delta_p95_1h
          value_type: FLOAT
          units: ms
          params: 'last(//infobus.api.ext.lat_p95_1h) - max(last_foreach(/*/infobus.api.lat_p95_1h))'
          description: 'What the public path (network, TLS and Traefik) adds to the next-trips p95: external p95 minus internal p95, both over the last hour.'
        - uuid: a11140b74a9a42dba74d9094a673d2cb
          name: 'External: other or no responses in the burst'
          type: DEPENDENT
          key: infobus.api.ext.errors
          description: 'Requests with a code other than 200, 204 and 429 (for example 500 or 502), or with no response.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.errors
              error_handler: DISCARD_VALUE
          master_item:
            key: infobus.api.ext
        - uuid: 591c9fea37de4d3eb4a772b912d126cb
          name: 'External: first request (opens the connection)'
          type: DEPENDENT
          key: infobus.api.ext.health_cold_ms
          value_type: FLOAT
          units: ms
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.health_cold_ms
              error_handler: DISCARD_VALUE
            - type: MATCHES_REGEX
              parameters:
                - '^-?[0-9]+(\.[0-9]+)?$'
              error_handler: DISCARD_VALUE
          master_item:
            key: infobus.api.ext
        - uuid: 1cdfd7748775408dbe6c99cc00d1cf99
          name: 'External: baseline with an open connection (network + TLS + Traefik + Daphne)'
          type: DEPENDENT
          key: infobus.api.ext.health_ms
          value_type: FLOAT
          units: ms
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.health_ms
              error_handler: DISCARD_VALUE
            - type: MATCHES_REGEX
              parameters:
                - '^-?[0-9]+(\.[0-9]+)?$'
              error_handler: DISCARD_VALUE
          master_item:
            key: infobus.api.ext
        - uuid: e09f4b3ebf7442ceae7d2c2785df0c4c
          name: 'Internal: L_api real p95, 1 h window'
          type: CALCULATED
          key: infobus.api.ext.int_p95_1h
          value_type: FLOAT
          units: ms
          params: 'max(last_foreach(/*/infobus.api.lat_p95_1h))'
          description: 'Copy of the internal probe p95, to compare it in this dashboard. It reads infobus.api.lat_p95_1h from whichever host has it (last_foreach over all hosts), so it works with any infobus host name (Infobus-host, srv-infobus...). Only the infobus host has that item.'
        - uuid: 6683b5d7b7774ea2a2a5b2fdad9dd07d
          name: 'External: L_api cycle p50'
          type: DEPENDENT
          key: infobus.api.ext.lat_p50
          value_type: FLOAT
          units: ms
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.lat_p50_ms
              error_handler: DISCARD_VALUE
            - type: MATCHES_REGEX
              parameters:
                - '^-?[0-9]+(\.[0-9]+)?$'
              error_handler: DISCARD_VALUE
          master_item:
            key: infobus.api.ext
        - uuid: 48eb4a2c0f03493a84b863e532acbafc
          name: 'External: L_api cycle p90'
          type: DEPENDENT
          key: infobus.api.ext.lat_p90
          value_type: FLOAT
          units: ms
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.lat_p90_ms
              error_handler: DISCARD_VALUE
            - type: MATCHES_REGEX
              parameters:
                - '^-?[0-9]+(\.[0-9]+)?$'
              error_handler: DISCARD_VALUE
          master_item:
            key: infobus.api.ext
        - uuid: 44c59d68affe4a2aa3882438d8f59459
          name: 'External: L_api real p95, 1 h window'
          type: CALCULATED
          key: infobus.api.ext.lat_p95_1h
          value_type: FLOAT
          units: ms
          params: 'percentile(//infobus.api.ext.lat_p50,1h,95)'
          description: 'Same calculation as infobus.api.lat_p95_1h of the internal probe, measured from outside (Traefik + HTTPS): p95 of the per-minute p50 values of the last hour.'
        - uuid: a5649f4313244b9ea0a2acc92c45a1a6
          name: 'External: burst requests'
          type: DEPENDENT
          key: infobus.api.ext.n
          description: 'Number of next-trips requests per cycle (--repeat).'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.n
              error_handler: DISCARD_VALUE
          master_item:
            key: infobus.api.ext
        - uuid: 3ba4a7b180704967b8a57db6240b1f02
          name: 'External: 200 responses in the burst'
          type: DEPENDENT
          key: infobus.api.ext.n_200
          description: 'Burst requests that returned 200 (with trips).'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.n_ok
              error_handler: DISCARD_VALUE
          master_item:
            key: infobus.api.ext
        - uuid: b65ab2fac3b8493f9aa5c00578170c11
          name: 'External: 204 responses in the burst'
          type: DEPENDENT
          key: infobus.api.ext.n_204
          description: 'Requests that returned 204: a valid response with no service that day. Computed as requests - 200 - 429 - other.'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var d = JSON.parse(value);
                  return d.n - d.n_ok - d.throttled - d.errors;
          master_item:
            key: infobus.api.ext
        - uuid: eb14d5700b1d4f4283622e8529ca07eb
          name: 'External: API responds correctly'
          type: DEPENDENT
          key: infobus.api.ext.ok
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.ok
              error_handler: DISCARD_VALUE
          master_item:
            key: infobus.api.ext
        - uuid: a1e8182859114fd98e34463d40225d4e
          name: 'External: query cost'
          type: DEPENDENT
          key: infobus.api.ext.query_p50
          value_type: FLOAT
          units: ms
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.query_p50_ms
              error_handler: DISCARD_VALUE
            - type: MATCHES_REGEX
              parameters:
                - '^-?[0-9]+(\.[0-9]+)?$'
              error_handler: DISCARD_VALUE
          master_item:
            key: infobus.api.ext
        - uuid: e2892ef9a94d4ab48175dc8526f5960b
          name: 'External: connection setup cost (TCP + TLS)'
          type: DEPENDENT
          key: infobus.api.ext.setup_ms
          value_type: FLOAT
          units: ms
          description: 'health_cold_ms - health_ms: TCP handshake and TLS negotiation from R4 to Traefik.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.setup_ms
              error_handler: DISCARD_VALUE
            - type: MATCHES_REGEX
              parameters:
                - '^-?[0-9]+(\.[0-9]+)?$'
              error_handler: DISCARD_VALUE
          master_item:
            key: infobus.api.ext
          triggers:
            - uuid: 2f3668dbd0ed47e3a225374811151e31
              expression: 'avg(/simovilab-infobus-ext/infobus.api.ext.setup_ms,10m)>{$INFOBUS.EXT.SETUP.FACTOR}*percentile(/simovilab-infobus-ext/infobus.api.ext.setup_ms,1d,50) and avg(/simovilab-infobus-ext/infobus.api.ext.setup_ms,10m)>{$INFOBUS.EXT.SETUP.MIN_MS}'
              name: 'External: connection setup cost out of the ordinary'
              priority: WARNING
              description: |
                What a user pays to open the connection to the public InfoBus API (DNS,
                TCP handshake and TLS negotiation with Traefik) rose above {$INFOBUS.EXT.SETUP.FACTOR}
                times its median of the last day, as a 10 min average, and is above
                {$INFOBUS.EXT.SETUP.MIN_MS} ms. Check public DNS, the network between R4 and the proxy,
                Traefik (certificate, load) or the site uplink.
        - uuid: 606f9d42e5324bf0bf85aada3288c244
          name: 'External: INFOBUS API table (HTML)'
          type: DEPENDENT
          key: infobus.api.ext.tabla_html
          history: 1d
          value_type: TEXT
          description: 'Status and latency table built by the probe, for the API-INFOBUS dashboard.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.tabla_html
              error_handler: DISCARD_VALUE
          master_item:
            key: infobus.api.ext
        - uuid: 8c4d43f61cf248e59d1c8241e167ceb7
          name: 'External: TCP connection from R4 to Traefik (network)'
          type: DEPENDENT
          key: infobus.api.ext.tcp_connect_ms
          value_type: FLOAT
          units: ms
          description: 'Median of 3 TCP connections to port 443, without DNS. Equivalent to a ping on the API port.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.tcp_connect_ms
              error_handler: DISCARD_VALUE
            - type: MATCHES_REGEX
              parameters:
                - '^-?[0-9]+(\.[0-9]+)?$'
              error_handler: DISCARD_VALUE
          master_item:
            key: infobus.api.ext
        - uuid: caba8d280bb1438da7b1e2041bd01d7f
          name: 'External: Too Many Requests (429): requests rejected by the rate limit'
          type: DEPENDENT
          key: infobus.api.ext.throttled
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.throttled
              error_handler: DISCARD_VALUE
          master_item:
            key: infobus.api.ext
        - uuid: 37ec6ea39ced428480ba80727b4cbdc4
          name: 'External: cycle timings (HTML)'
          type: DEPENDENT
          key: infobus.api.ext.tiempos_html
          history: 1d
          value_type: TEXT
          description: 'Table with every timing of the cycle (network, TLS, baseline and next-trips), for the API-INFOBUS dashboard.'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var d = JSON.parse(value);
                  var th = 'style="text-align:left;padding:4px 12px;border-bottom:2px solid #8888;white-space:nowrap"';
                  var td = 'style="padding:4px 12px;border-bottom:1px solid #8884;white-space:nowrap"';
                  var tdn = 'style="padding:4px 12px;border-bottom:1px solid #8884;white-space:nowrap;text-align:right;font-weight:bold"';
                  var tdd = 'style="padding:4px 12px;border-bottom:1px solid #8884;white-space:normal;opacity:.85"';
                  function ms(v) { return (v === null || v === undefined) ? '-' : (Math.round(v * 10) / 10) + ' ms'; }
                  var rows = [
                    ['TCP connection (network)', d.tcp_connect_ms, 'Network only, from srv-gestion to Traefik (port 443)'],
                    ['Connection setup (TCP + TLS)', d.setup_ms, 'What a user pays the first time: TCP handshake and TLS negotiation'],
                    ['First request to /health/', d.health_cold_ms, 'Includes opening the connection'],
                    ['Baseline /health/', d.health_ms, 'Network + TLS + Traefik + web server, with the connection open'],
                    ['Query cost', d.query_p50_ms, 'next-trips p50 minus the baseline: API and database'],
                    ['next-trips minimum', d.lat_min_ms, ''],
                    ['next-trips p50', d.lat_p50_ms, 'Half of the requests took less than this'],
                    ['next-trips p90', d.lat_p90_ms, '9 out of 10 requests took less than this'],
                    ['next-trips maximum', d.lat_max_ms, ''],
                    ['next-trips mean', d.lat_mean_ms, ''],
                    ['next-trips standard deviation', d.lat_stdev_ms, 'How much the requests of the cycle vary from each other'],
                    ['next-trips with no service (204), p50', d.lat_sin_servicio_p50_ms, 'Only on days with no service']
                  ];
                  var h = '<div style="font-size:calc(1em + 6px)"><br><div style="font-weight:bold;font-size:1.1em;color:#4169E1;text-decoration:underline">CYCLE TIMINGS</div><br>';
                  h += '<table style="border-collapse:collapse"><tr><th ' + th + '>Measurement</th><th ' + th + '>Value</th><th ' + th + '>Meaning</th></tr>';
                  for (var i = 0; i < rows.length; i++) {
                    h += '<tr><td ' + td + '>' + rows[i][0] + '</td><td ' + tdn + '>' + ms(rows[i][1]) + '</td><td ' + tdd + '>' + rows[i][2] + '</td></tr>';
                  }
                  h += '</table><div style="opacity:.7;font-size:.75em;margin-top:4px">' + d.n + ' next-trips requests · stop ' + d.stop_id + '</div></div>';
                  return h;
          master_item:
            key: infobus.api.ext
      macros:
        - macro: '{$INFOBUS.EXT.SETUP.FACTOR}'
          value: '2'
          description: 'Times the daily median of the public connection setup cost (DNS + TCP + TLS) that raises the alert.'
        - macro: '{$INFOBUS.EXT.SETUP.MIN_MS}'
          value: '5'
          description: 'Minimum in ms to alert on the public connection setup cost (floor in case the daily median is very low).'
      dashboards:
