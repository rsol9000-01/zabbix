                      value: QPUTZ
                - type: gauge
                  name: 'Espacio libre en disco (/)'
                  x: '54'
                  y: '0'
                  width: '18'
                  height: '5'
                  fields:
                    - type: ITEM
                      name: itemid.0
                      value:
                        host: 'simovilab servidor y sistema operativo'
                        key: 'vfs.fs.size[/hostfs,pfree]'
                    - type: STRING
                      name: min
                      value: '0'
                    - type: STRING
