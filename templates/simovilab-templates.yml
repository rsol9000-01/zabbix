                    - type: STRING
                      name: th.0.threshold
                      value: '0'
                    - type: STRING
                      name: th.1.color
                      value: FFD54F
                    - type: STRING
                      name: th.1.threshold
                      value: '75'
                    - type: STRING
                      name: th.2.color
                      value: FF465C
                    - type: STRING
                      name: th.2.threshold
                      value: '90'
                    - type: STRING
                      name: reference
                      value: QSGFZ
                - type: gauge
                  name: 'Carga por CPU (1 min)'
                  x: '36'
                  y: '0'
                  width: '18'
                  height: '5'
                  fields:
                    - type: ITEM
                      name: itemid.0
                      value:
                        host: 'simovilab servidor y sistema operativo'
                        key: 'system.cpu.load[percpu,avg1]'
                    - type: STRING
                      name: min
                      value: '0'
                    - type: STRING
                      name: max
                      value: '2'
                    - type: STRING
                      name: th.0.color
                      value: 0EC9AC
                    - type: STRING
                      name: th.0.threshold
                      value: '0'
                    - type: STRING
                      name: th.1.color
                      value: FFD54F
                    - type: STRING
                      name: th.1.threshold
                      value: '0.7'
                    - type: STRING
                      name: th.2.color
                      value: FF465C
                    - type: STRING
                      name: th.2.threshold
                      value: '1'
                    - type: STRING
