zabbix_export:
  version: '7.4'
  template_groups:
    - uuid: 7df96b18c230490a9a0a9e2307226338
      name: Templates
  templates:
    - uuid: 0c6f8c85075a4eb7a598b20fd62a2c8b
      template: 'simovilab servidor y sistema operativo'
      name: 'simovilab servidor y sistema operativo'
      groups:
        - name: Templates
      items:
        - uuid: e440a17567444b4f8c0ef9a32ec94990
          name: 'TCP connections ESTABLISHED'
          type: ZABBIX_ACTIVE
          key: host.tcp.established
          trends: '0'
          description: 'Número de conexiones TCP actualmente en estado ESTABLISHED.'
          triggers:
            - uuid: c25ecd52e305407089767b48e9f18ee9
              expression: 'min(/simovilab servidor y sistema operativo/host.tcp.established,5m)>800'
              name: 'Too many established TCP connections'
              priority: WARNING
            - uuid: 18786f31d0184621906e389f8541a9ee
              expression: 'min(/simovilab servidor y sistema operativo/host.tcp.established,5m)>1200'
              name: 'Too many established TCP connections'
              priority: HIGH
        - uuid: 145b4c3d63ad4e01b8e90e15b968c475
          name: 'Load average per CPU (1 min)'
          type: ZABBIX_ACTIVE
          key: 'system.cpu.load[percpu,avg1]'
          value_type: FLOAT
          description: 'Carga promedio del sistema durante el último minuto, normalizada por la cantidad de CPUs lógicas.'
          triggers:
            - uuid: 6aa58ea89b274401b9d8cd5af18b3641
              expression: 'min(/simovilab servidor y sistema operativo/system.cpu.load[percpu,avg1],5m)>1'
              name: 'System load per CPU is critical'
              priority: HIGH
            - uuid: 0b9c545c132f4cf3bd29a01989222138
              expression: 'min(/simovilab servidor y sistema operativo/system.cpu.load[percpu,avg1],5m)>0.7'
              name: 'System load per CPU is high'
              priority: WARNING
        - uuid: 230019eee5544110874beb8d7c562a05
          name: 'CPU utilization (user + system)'
          key: system.cpu.util
          value_type: FLOAT
          units: '%'
          description: |
            Basado en item estándar de Zabbix:system.cpu.util
            Adaptado para plantilla simovilab personalizada.
            Mide consumo total CPU incluyendo user + system.
          triggers:
            - uuid: 6f65eac423d445a480300218e9299dee
              expression: 'min(/simovilab servidor y sistema operativo/system.cpu.util,5m)>90'
              name: 'CPU utilization critical'
              priority: HIGH
            - uuid: 8735a3822a204313a26d403add2b25c4
              expression: 'min(/simovilab servidor y sistema operativo/system.cpu.util,5m)>70'
              name: 'CPU utilization high'
              event_name: 'simovilab servidor y sistema operativo'
              priority: WARNING
        - uuid: 3e8ec8a1e9804b35a6ff50ae1d7c63de
          name: 'Disk I/O wait'
          type: ZABBIX_ACTIVE
          key: 'system.cpu.util[,iowait]'
          value_type: FLOAT
          units: '%'
          description: 'Porcentaje de tiempo que la CPU permanece esperando operaciones de lectura o escritura en dispositivos de almacenamiento.'
          triggers:
            - uuid: 354c01061ff042fba7da4e6eaeb9bf7e
              expression: 'min(/simovilab servidor y sistema operativo/system.cpu.util[,iowait],5m)>30'
              name: 'Disk I/O wait critical'
              priority: HIGH
            - uuid: c7734e0b886c43d0ab2ede80efbb5d71
              expression: 'min(/simovilab servidor y sistema operativo/system.cpu.util[,iowait],5m)>15'
              name: 'Disk I/O wait high'
              priority: WARNING
        - uuid: a1ef2cb425574568a0379f6157a62137
          name: Uptime
          type: ZABBIX_ACTIVE
          key: system.uptime
          units: s
          description: |
            Tiempo transcurrido desde el último inicio del sistema operativo, expresado en segundos.
            Se utiliza para detectar reinicios recientes del servidor.
          triggers:
            - uuid: 852e0b9dca5242158ef5ac089d5cbb6b
              expression: 'last(/simovilab servidor y sistema operativo/system.uptime)<300'
              name: 'Server has been restarted recently'
              priority: WARNING
              description: 'El servidor se reinició recientemente. Verificar si el reinicio fue programado o inesperado.'
        - uuid: 8ee1e44871c04839ada7457da5bc1d1f
          name: 'Disk space free (/)'
          type: ZABBIX_ACTIVE
          key: 'vfs.fs.size[/hostfs,pfree]'
          delay: 5m
          value_type: FLOAT
          units: '%'
          description: 'Porcentaje de espacio libre del sistema de archivos raíz (/).'
          triggers:
            - uuid: 9a9877bee4c64c47a95521de63591698
              expression: 'max(/simovilab servidor y sistema operativo/vfs.fs.size[/hostfs,pfree],5m)<10'
              name: 'Disk space critical (/)'
              priority: HIGH
            - uuid: d178dd3bf1c74e50bbaaf30afc950302
              expression: 'max(/simovilab servidor y sistema operativo/vfs.fs.size[/hostfs,pfree],5m)<20'
              name: 'Disk space low (/)'
              priority: WARNING
        - uuid: 57848c5a7c2342a287b0dfb1a393e346
          name: 'Memory utilization (% used)'
          type: ZABBIX_ACTIVE
          key: 'vm.memory.size[pused]'
          value_type: FLOAT
          units: '%'
          description: |
            Porcentaje de memoria RAM utilizada.
            Calculado por el agente Zabbix mediante vm.memory.size[pused].
          triggers:
            - uuid: 7012578224c94842a1907ea4279ec6b9
              expression: 'min(/simovilab servidor y sistema operativo/vm.memory.size[pused],5m)>90'
              name: 'Memory utilization critical'
              priority: HIGH
            - uuid: d26831e891b34299aea14c16aa9b80cf
              expression: 'min(/simovilab servidor y sistema operativo/vm.memory.size[pused],5m)>75'
              name: 'Memory utilization high'
              priority: WARNING
      tags:
        - tag: simovilab
          value: S.O

      dashboards:
