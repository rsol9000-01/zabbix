                        host: 'simovilab servidor y sistema operativo'
                        key: 'system.cpu.util'
                    - type: STRING
                      name: min
                      value: '0'
                    - type: STRING
                      name: max
                      value: '100'
                    - type: STRING
                      name: th.0.color
                      value: 0EC9AC
                    - type: STRING
                      name: th.0.threshold
                      value: '0'
                    - type: STRING
                      name: th.1.color
                      value: FFD54F
                    - type: STRING
                      name: th.1.threshold
                      value: '70'
                    - type: STRING
                      name: th.2.color
                      value: FF465C
                    - type: STRING
                      name: th.2.threshold
                      value: '90'
