zabbix_export:
  version: '7.4'
  template_groups:
    - uuid: 7df96b18c230490a9a0a9e2307226338
      name: Templates
  templates:
    - uuid: 0c6f8c85075a4eb7a598b20fd62a2c8b
      template: 'simovilab servidor y sistema operativo'
      name: 'simovilab servidor y sistema operativo'
      groups:
        - name: Templates
      items:
        - uuid: e440a17567444b4f8c0ef9a32ec94990
          name: 'TCP connections ESTABLISHED'
          type: ZABBIX_ACTIVE
          key: host.tcp.established
          trends: '0'
          description: 'Número de conexiones TCP actualmente en estado ESTABLISHED.'
          triggers:
            - uuid: c25ecd52e305407089767b48e9f18ee9
              expression: 'min(/simovilab servidor y sistema operativo/host.tcp.established,5m)>800'
              name: 'Too many established TCP connections'
              priority: WARNING
            - uuid: 18786f31d0184621906e389f8541a9ee
              expression: 'min(/simovilab servidor y sistema operativo/host.tcp.established,5m)>1200'
              name: 'Too many established TCP connections'
              priority: HIGH
        - uuid: a24b3ca9c0d64949ab2836fc70c4910c
          name: 'Server UP/DOWN'
          type: SIMPLE
          key: 'icmpping[,3]'
          delay: 10s
          valuemap:
            name: 'Estado ping'
          description: |
            Ping desde el servidor Zabbix (R4) a la IP de la interfaz del host: 3 paquetes cada 10 s.
            1 = respondió al menos uno, 0 = no respondió ninguno.
          triggers:
            - uuid: 672585c4b0f5472098a3c097b433cd46
              expression: 'max(/simovilab servidor y sistema operativo/icmpping[,3],#3)=0'
              recovery_mode: RECOVERY_EXPRESSION
              recovery_expression: 'last(/simovilab servidor y sistema operativo/icmpping[,3])=1'
              name: 'Server DOWN!!!'
              priority: DISASTER
              description: 'Tres consultas seguidas (unos 30 s) sin respuesta a ningún ping. Se cierra con el primer ping respondido.'
        - uuid: 145b4c3d63ad4e01b8e90e15b968c475
          name: 'Load average per CPU (1 min)'
          type: ZABBIX_ACTIVE
          key: 'system.cpu.load[percpu,avg1]'
          value_type: FLOAT
          description: 'Carga promedio del sistema durante el último minuto, normalizada por la cantidad de CPUs lógicas.'
          triggers:
            - uuid: 6aa58ea89b274401b9d8cd5af18b3641
              expression: 'min(/simovilab servidor y sistema operativo/system.cpu.load[percpu,avg1],5m)>1'
              name: 'System load per CPU is critical'
              priority: HIGH
            - uuid: 0b9c545c132f4cf3bd29a01989222138
              expression: 'min(/simovilab servidor y sistema operativo/system.cpu.load[percpu,avg1],5m)>0.7'
              name: 'System load per CPU is high'
              priority: WARNING
        - uuid: 230019eee5544110874beb8d7c562a05
          name: 'CPU utilization (user + system)'
          key: system.cpu.util
          value_type: FLOAT
          units: '%'
          description: |
            Basado en item estándar de Zabbix:system.cpu.util
            Adaptado para plantilla simovilab personalizada.
            Mide consumo total CPU incluyendo user + system.
          triggers:
            - uuid: 6f65eac423d445a480300218e9299dee
              expression: 'min(/simovilab servidor y sistema operativo/system.cpu.util,5m)>90'
              name: 'CPU utilization critical'
              priority: HIGH
            - uuid: 8735a3822a204313a26d403add2b25c4
              expression: 'min(/simovilab servidor y sistema operativo/system.cpu.util,5m)>70'
              name: 'CPU utilization high'
              priority: WARNING
        - uuid: 3e8ec8a1e9804b35a6ff50ae1d7c63de
          name: 'Disk I/O wait'
          type: ZABBIX_ACTIVE
          key: 'system.cpu.util[,iowait]'
          value_type: FLOAT
          units: '%'
          description: 'Porcentaje de tiempo que la CPU permanece esperando operaciones de lectura o escritura en dispositivos de almacenamiento.'
          triggers:
            - uuid: 354c01061ff042fba7da4e6eaeb9bf7e
              expression: 'min(/simovilab servidor y sistema operativo/system.cpu.util[,iowait],5m)>30'
              name: 'Disk I/O wait critical'
              priority: HIGH
            - uuid: c7734e0b886c43d0ab2ede80efbb5d71
              expression: 'min(/simovilab servidor y sistema operativo/system.cpu.util[,iowait],5m)>15'
              name: 'Disk I/O wait high'
              priority: WARNING
        - uuid: a1ef2cb425574568a0379f6157a62137
          name: Uptime
          type: ZABBIX_ACTIVE
          key: system.uptime
          units: s
          description: |
            Tiempo transcurrido desde el último inicio del sistema operativo, expresado en segundos.
            Se utiliza para detectar reinicios recientes del servidor.
          triggers:
            - uuid: 852e0b9dca5242158ef5ac089d5cbb6b
              expression: 'last(/simovilab servidor y sistema operativo/system.uptime)<300'
              name: 'Server has been restarted recently'
              priority: WARNING
              description: 'El servidor se reinició recientemente. Verificar si el reinicio fue programado o inesperado.'
        - uuid: 8ee1e44871c04839ada7457da5bc1d1f
          name: 'Disk space free (/)'
          type: ZABBIX_ACTIVE
          key: 'vfs.fs.size[/hostfs,pfree]'
          delay: 5m
          value_type: FLOAT
          units: '%'
          description: 'Porcentaje de espacio libre del sistema de archivos raíz (/).'
          triggers:
            - uuid: 9a9877bee4c64c47a95521de63591698
              expression: 'max(/simovilab servidor y sistema operativo/vfs.fs.size[/hostfs,pfree],5m)<10'
              name: 'Disk space critical (/)'
              priority: HIGH
            - uuid: d178dd3bf1c74e50bbaaf30afc950302
              expression: 'max(/simovilab servidor y sistema operativo/vfs.fs.size[/hostfs,pfree],5m)<20'
              name: 'Disk space low (/)'
              priority: WARNING
        - uuid: 57848c5a7c2342a287b0dfb1a393e346
          name: 'Memory utilization (% used)'
          type: ZABBIX_ACTIVE
          key: 'vm.memory.size[pused]'
          value_type: FLOAT
          units: '%'
          description: |
            Porcentaje de memoria RAM utilizada.
            Calculado por el agente Zabbix mediante vm.memory.size[pused].
          triggers:
            - uuid: 7012578224c94842a1907ea4279ec6b9
              expression: 'min(/simovilab servidor y sistema operativo/vm.memory.size[pused],5m)>90'
              name: 'Memory utilization critical'
              priority: HIGH
            - uuid: d26831e891b34299aea14c16aa9b80cf
              expression: 'min(/simovilab servidor y sistema operativo/vm.memory.size[pused],5m)>75'
              name: 'Memory utilization high'
              priority: WARNING
      discovery_rules:
        - uuid: 59680b0210264a4794cc7b4aa7dfe718
          name: 'Contenedores (todos, incluidos los detenidos)'
          type: ZABBIX_ACTIVE
          key: 'docker.containers.discovery[true]'
          delay: 5m
          filter:
            conditions:
              - macro: '{#NAME}'
                value: '{$CONTENEDOR.IGNORAR}'
                operator: NOT_MATCHES_REGEX
          description: |
            Descubre todos los contenedores Docker del host, también los detenidos (parámetro true),
            para alertar cuando uno se apaga o se reinicia. Complementa a Docker by Zabbix agent 2,
            que solo descubre los que están corriendo y solo alerta salidas con código de error.
          item_prototypes:
            - uuid: d5ba951d63514666b8e904993f53fef1
              name: 'Contenedor {#NAME}: info (short)'
              type: ZABBIX_ACTIVE
              key: 'docker.container_info["{#NAME}",short]'
              history: '0'
              value_type: TEXT
              tags:
                - tag: contenedor
                  value: '{#NAME}'
            - uuid: 3f3185c5e7484d8caa969d6a949597d9
              name: 'Contenedor {#NAME}: código de salida'
              type: DEPENDENT
              key: 'simovilab.contenedor.exitcode["{#NAME}"]'
              value_type: FLOAT
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.State.ExitCode
              master_item:
                key: 'docker.container_info["{#NAME}",short]'
              tags:
                - tag: contenedor
                  value: '{#NAME}'
            - uuid: d9461ced450d4560b3cbd370e77c781e
              name: 'Contenedor {#NAME}: reinicios automáticos'
              type: DEPENDENT
              key: 'simovilab.contenedor.restart_count["{#NAME}"]'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.RestartCount
              master_item:
                key: 'docker.container_info["{#NAME}",short]'
              tags:
                - tag: contenedor
                  value: '{#NAME}'
            - uuid: 1dd45f32aa4d4106b71ce07b478618c5
              name: 'Contenedor {#NAME}: corriendo'
              type: DEPENDENT
              key: 'simovilab.contenedor.running["{#NAME}"]'
              valuemap:
                name: 'Contenedor corriendo'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.State.Running
                - type: BOOL_TO_DECIMAL
              master_item:
                key: 'docker.container_info["{#NAME}",short]'
              tags:
                - tag: contenedor
                  value: '{#NAME}'
              trigger_prototypes:
                - uuid: 44e3f169c6ba40a7ad2c5048d54fe1b7
                  expression: 'last(/simovilab servidor y sistema operativo/simovilab.contenedor.running["{#NAME}"])=0'
                  name: 'Contenedor {#NAME} apagado'
                  priority: AVERAGE
                  description: |
                    El contenedor existe pero no está corriendo: se apagó (docker stop, compose
                    down de un servicio) o terminó, con o sin error. Cubre también la salida limpia
                    (código 0), que la plantilla Docker by Zabbix agent 2 no alerta. Para ignorar
                    contenedores que terminan a propósito (p. ej. zabbix-init), ajustar la macro
                    {$CONTENEDOR.IGNORAR}.
            - uuid: 879682cfb42644468f9629dd4a7bb195
              name: 'Contenedor {#NAME}: hora de inicio'
              type: DEPENDENT
              key: 'simovilab.contenedor.started["{#NAME}"]'
              units: unixtime
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.State.StartedAt
              master_item:
                key: 'docker.container_info["{#NAME}",short]'
              tags:
                - tag: contenedor
                  value: '{#NAME}'
          trigger_prototypes:
            - uuid: ab802e609a0046cd9467c21ef22f401d
              expression: 'last(/simovilab servidor y sistema operativo/simovilab.contenedor.running["{#NAME}"])=1 and now()-last(/simovilab servidor y sistema operativo/simovilab.contenedor.started["{#NAME}"])<{$CONTENEDOR.REINICIO.VENTANA}'
              name: 'Contenedor {#NAME} se reinició'
              priority: WARNING
              description: |
                El contenedor arrancó hace menos de {$CONTENEDOR.REINICIO.VENTANA} segundos (cambió su
                hora de inicio): reinicio manual, reinicio automático por una caída o
                reinicio del host. El problema se cierra solo al pasar la ventana.
      tags:
        - tag: simovilab
          value: S.O
      macros:
        - macro: '{$CONTENEDOR.IGNORAR}'
          value: '-init|migrat|-run-'
          description: 'Regex de nombres de contenedor que no se vigilan (terminan a propósito: init, migraciones, docker compose run).'
        - macro: '{$CONTENEDOR.REINICIO.VENTANA}'
          value: '600'
          description: 'Segundos que el problema "se reinició" queda activo después de que el contenedor arranca.'
      dashboards:
        - uuid: a7328706b64249618e4248544158d239
          name: Servidor
          pages:
            - name: Operación
              widgets:
                - type: gauge
                  name: 'CPU en uso'
                  width: '18'
                  height: '5'
                  fields:
                    - type: ITEM
                      name: itemid.0
                      value:
                        host: 'simovilab servidor y sistema operativo'
                        key: system.cpu.util
                    - type: STRING
                      name: max
                      value: '100'
                    - type: STRING
                      name: min
                      value: '0'
                    - type: STRING
                      name: reference
                      value: ORYOO
                    - type: STRING
                      name: th.0.color
                      value: 0EC9AC
                    - type: STRING
                      name: th.0.threshold
                      value: '0'
                    - type: STRING
                      name: th.1.color
                      value: FFD54F
                    - type: STRING
                      name: th.1.threshold
                      value: '70'
                    - type: STRING
                      name: th.2.color
                      value: FF465C
                    - type: STRING
                      name: th.2.threshold
                      value: '90'
                - type: item
                  name: 'Tiempo encendido'
                  'y': '5'
                  width: '24'
                  height: '3'
                  fields:
                    - type: ITEM
                      name: itemid.0
                      value:
                        host: 'simovilab servidor y sistema operativo'
                        key: system.uptime
                    - type: STRING
                      name: reference
                      value: CRZWU
                - type: graph
                  name: 'CPU y memoria'
                  'y': '8'
                  width: '36'
                  height: '6'
                  fields:
                    - type: GRAPH
                      name: graphid.0
                      value:
                        host: 'simovilab servidor y sistema operativo'
                        name: 'host: CPU y memoria'
                    - type: STRING
                      name: reference
                      value: AQCBB
                - type: gauge
                  name: 'Memoria RAM en uso'
                  x: '18'
                  width: '18'
                  height: '5'
                  fields:
                    - type: ITEM
                      name: itemid.0
                      value:
                        host: 'simovilab servidor y sistema operativo'
                        key: 'vm.memory.size[pused]'
                    - type: STRING
                      name: max
                      value: '100'
                    - type: STRING
                      name: min
                      value: '0'
                    - type: STRING
                      name: reference
                      value: QSGFZ
                    - type: STRING
                      name: th.0.color
                      value: 0EC9AC
                    - type: STRING
                      name: th.0.threshold
                      value: '0'
                    - type: STRING
                      name: th.1.color
                      value: FFD54F
                    - type: STRING
                      name: th.1.threshold
                      value: '75'
                    - type: STRING
                      name: th.2.color
                      value: FF465C
                    - type: STRING
                      name: th.2.threshold
                      value: '90'
                - type: item
                  name: 'Conexiones TCP establecidas'
                  x: '24'
                  'y': '5'
                  width: '24'
                  height: '3'
                  fields:
                    - type: ITEM
                      name: itemid.0
                      value:
                        host: 'simovilab servidor y sistema operativo'
                        key: host.tcp.established
                    - type: STRING
                      name: reference
                      value: BTMOU
                - type: gauge
                  name: 'Carga por CPU (1 min)'
                  x: '36'
                  width: '18'
                  height: '5'
                  fields:
                    - type: ITEM
                      name: itemid.0
                      value:
                        host: 'simovilab servidor y sistema operativo'
                        key: 'system.cpu.load[percpu,avg1]'
                    - type: STRING
                      name: max
                      value: '2'
                    - type: STRING
                      name: min
                      value: '0'
                    - type: STRING
                      name: reference
                      value: QPUTZ
                    - type: STRING
                      name: th.0.color
                      value: 0EC9AC
                    - type: STRING
                      name: th.0.threshold
                      value: '0'
                    - type: STRING
                      name: th.1.color
                      value: FFD54F
                    - type: STRING
                      name: th.1.threshold
                      value: '0.7'
                    - type: STRING
                      name: th.2.color
                      value: FF465C
                    - type: STRING
                      name: th.2.threshold
                      value: '1'
                - type: graph
                  name: 'Carga por CPU'
                  x: '36'
                  'y': '8'
                  width: '36'
                  height: '6'
                  fields:
                    - type: GRAPH
                      name: graphid.0
                      value:
                        host: 'simovilab servidor y sistema operativo'
                        name: 'host: carga por CPU'
                    - type: STRING
                      name: reference
                      value: GHTAY
                - type: item
                  name: 'Espera de disco (I/O wait)'
                  x: '48'
                  'y': '5'
                  width: '24'
                  height: '3'
                  fields:
                    - type: ITEM
                      name: itemid.0
                      value:
                        host: 'simovilab servidor y sistema operativo'
                        key: 'system.cpu.util[,iowait]'
                    - type: STRING
                      name: reference
                      value: XTUFT
                - type: gauge
                  name: 'Espacio libre en disco (/)'
                  x: '54'
                  width: '18'
                  height: '5'
                  fields:
                    - type: ITEM
                      name: itemid.0
                      value:
                        host: 'simovilab servidor y sistema operativo'
                        key: 'vfs.fs.size[/hostfs,pfree]'
                    - type: STRING
                      name: max
                      value: '100'
                    - type: STRING
                      name: min
                      value: '0'
                    - type: STRING
                      name: reference
                      value: FDOJE
                    - type: STRING
                      name: th.0.color
                      value: FF465C
                    - type: STRING
                      name: th.0.threshold
                      value: '0'
                    - type: STRING
                      name: th.1.color
                      value: FFD54F
                    - type: STRING
                      name: th.1.threshold
                      value: '10'
                    - type: STRING
                      name: th.2.color
                      value: 0EC9AC
                    - type: STRING
                      name: th.2.threshold
                      value: '20'
            - name: Contenedores
              widgets:
                - type: honeycomb
                  name: 'Contenedores arriba (verde) o detenidos (rojo)'
                  width: '72'
                  height: '5'
                  fields:
                    - type: STRING
                      name: items.0
                      value: 'Contenedor *: corriendo'
                    - type: STRING
                      name: primary_label
                      value: '{{ITEM.NAME}.regsub("Contenedor .([^:]+)", "\1")}'
                    - type: STRING
                      name: reference
                      value: DKRUN
                    - type: INTEGER
                      name: show.0
                      value: '1'
                    - type: STRING
                      name: thresholds.0.color
                      value: FF465C
                    - type: STRING
                      name: thresholds.0.threshold
                      value: '0'
                    - type: STRING
                      name: thresholds.1.color
                      value: 0EC9AC
                    - type: STRING
                      name: thresholds.1.threshold
                      value: '1'
                - type: honeycomb
                  name: 'Último arranque o reinicio'
                  'y': '5'
                  width: '72'
                  height: '5'
                  fields:
                    - type: STRING
                      name: items.0
                      value: 'Contenedor *: hora de inicio'
                    - type: STRING
                      name: primary_label
                      value: '{{ITEM.NAME}.regsub("Contenedor .([^:]+)", "\1")}'
                    - type: STRING
                      name: reference
                      value: DKSTA
                - type: honeycomb
                  name: 'Cantidad de reinicios'
                  'y': '10'
                  width: '72'
                  height: '5'
                  fields:
                    - type: STRING
                      name: items.0
                      value: 'Contenedor *: reinicios automáticos'
                    - type: STRING
                      name: primary_label
                      value: '{{ITEM.NAME}.regsub("Contenedor .([^:]+)", "\1")}'
                    - type: STRING
                      name: reference
                      value: DKRST
                    - type: INTEGER
                      name: secondary_label_decimal_places
                      value: '0'
                    - type: STRING
                      name: thresholds.0.color
                      value: 0EC9AC
                    - type: STRING
                      name: thresholds.0.threshold
                      value: '0'
                    - type: STRING
                      name: thresholds.1.color
                      value: FFD54F
                    - type: STRING
                      name: thresholds.1.threshold
                      value: '1'
      valuemaps:
        - uuid: 9839fce9adf041868a71ce6618adb583
          name: 'Estado ping'
          mappings:
            - value: '0'
              newvalue: Caído
            - value: '1'
              newvalue: Arriba
        - uuid: 92eaba63ea4e4c33b55b9b6b548d1a6d
          name: 'Contenedor corriendo'
          mappings:
            - value: '0'
              newvalue: Detenido
            - value: '1'
              newvalue: Corriendo
  graphs:
    - uuid: 61b1080e6e6c412196712cd6ab805a2c
      name: 'host: carga por CPU'
      graph_items:
        - color: F63100
          item:
            host: 'simovilab servidor y sistema operativo'
            key: 'system.cpu.load[percpu,avg1]'
    - uuid: b5ee4ff0f9644e78965e3e428f97d346
      name: 'host: CPU y memoria'
      graph_items:
        - color: 2774A4
          item:
            host: 'simovilab servidor y sistema operativo'
            key: system.cpu.util
        - sortorder: '1'
          color: 199C0D
          item:
            host: 'simovilab servidor y sistema operativo'
            key: 'vm.memory.size[pused]'
        - sortorder: '2'
          color: F7941D
          item:
            host: 'simovilab servidor y sistema operativo'
            key: 'system.cpu.util[,iowait]'