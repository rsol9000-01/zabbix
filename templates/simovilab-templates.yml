zabbix_export:
  version: '7.4'
  template_groups:
    - uuid: 7df96b18c230490a9a0a9e2307226338
      name: Templates
  templates:
    - uuid: 0c6f8c85075a4eb7a598b20fd62a2c8b
      template: 'simovilab servidor y sistema operativo'
      name: 'simovilab servidor y sistema operativo'
      groups:
        - name: Templates
      items:
        - uuid: e440a17567444b4f8c0ef9a32ec94990
          name: 'TCP connections ESTABLISHED'
          type: ZABBIX_ACTIVE
          key: host.tcp.established
          trends: '0'
          description: 'Número de conexiones TCP actualmente en estado ESTABLISHED.'
          triggers:
            - uuid: c25ecd52e305407089767b48e9f18ee9
              expression: 'min(/simovilab servidor y sistema operativo/host.tcp.established,5m)>800'
              name: 'Too many established TCP connections'
              priority: WARNING
            - uuid: 18786f31d0184621906e389f8541a9ee
              expression: 'min(/simovilab servidor y sistema operativo/host.tcp.established,5m)>1200'
              name: 'Too many established TCP connections'
              priority: HIGH
        - uuid: a24b3ca9c0d64949ab2836fc70c4910c
          name: 'Server UP/DOWN'
          type: SIMPLE
          key: 'icmpping[,3]'
          delay: 10s
          description: |
            Ping desde el servidor Zabbix (R4) a la IP de la interfaz del host: 3 paquetes cada 10 s.
            1 = respondió al menos uno, 0 = no respondió ninguno.
          valuemap:
            name: 'Estado ping'
          triggers:
            - uuid: 672585c4b0f5472098a3c097b433cd46
              expression: 'max(/simovilab servidor y sistema operativo/icmpping[,3],#3)=0'
              recovery_mode: RECOVERY_EXPRESSION
              recovery_expression: 'last(/simovilab servidor y sistema operativo/icmpping[,3])=1'
              name: 'Server DOWN!!!'
              priority: DISASTER
              description: 'Tres consultas seguidas (unos 30 s) sin respuesta a ningún ping. Se cierra con el primer ping respondido.'
        - uuid: 145b4c3d63ad4e01b8e90e15b968c475
          name: 'CPU pressure (1 min)'
          type: DEPENDENT
          key: simovilab.cpu.psi
          value_type: FLOAT
          units: '%'
          description: |
            Presión de CPU (PSI, línea some, promedio de 60 s): porcentaje del tiempo en que al menos un
            proceso estuvo listo para correr y esperó por CPU. 0 % = nunca esperaron.
            Reemplaza a la carga por CPU (system.cpu.load[percpu,avg1]): dentro de un LXC esa carga es la
            del host Proxmox dividida entre los núcleos del LXC, y Linux no lleva carga por contenedor.
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var m = value.match(/^some avg10=[\d.]+ avg60=([\d.]+)/m);
                  if (!m) throw "No hay línea some en el archivo de presión";
                  return m[1];
          master_item:
            key: 'vfs.file.contents[/hostfs/cpu.pressure]'
          triggers:
            - uuid: 6aa58ea89b274401b9d8cd5af18b3641
              expression: 'min(/simovilab servidor y sistema operativo/simovilab.cpu.psi,5m)>{$CPU.PSI.CRIT}'
              name: 'CPU pressure is critical'
              priority: HIGH
              description: 'Durante 5 min, procesos esperando CPU más del {$CPU.PSI.CRIT} % del tiempo.'
            - uuid: 0b9c545c132f4cf3bd29a01989222138
              expression: 'min(/simovilab servidor y sistema operativo/simovilab.cpu.psi,5m)>{$CPU.PSI.WARN}'
              name: 'CPU pressure is high'
              priority: WARNING
              description: 'Durante 5 min, procesos esperando CPU más del {$CPU.PSI.WARN} % del tiempo.'
        - uuid: 230019eee5544110874beb8d7c562a05
          name: 'CPU utilization (user + system)'
          type: DEPENDENT
          key: simovilab.cpu.util
          value_type: FLOAT
          units: '%'
          description: |
            Porcentaje de CPU usada por el servidor sobre sus núcleos: tasa por segundo de usage_usec
            dividida entre nproc. 100 % = todos los núcleos ocupados. En un LXC mide solo el LXC.
            Reemplaza a system.cpu.util, que dentro de un LXC mide el host Proxmox.
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var u = value.match(/^usage_usec (\d+)/m), n = value.match(/^nproc (\d+)/m);
                  if (!u || !n) throw "Faltan usage_usec o nproc en el archivo de CPU";
                  return u[1] / n[1];
            - type: CHANGE_PER_SECOND
            - type: MULTIPLIER
              parameters:
                - '0.0001'
          master_item:
            key: 'vfs.file.contents[/hostfs/cpu]'
          triggers:
            - uuid: 6f65eac423d445a480300218e9299dee
              expression: 'min(/simovilab servidor y sistema operativo/simovilab.cpu.util,5m)>90'
              name: 'CPU utilization critical'
              priority: HIGH
            - uuid: 8735a3822a204313a26d403add2b25c4
              expression: 'min(/simovilab servidor y sistema operativo/simovilab.cpu.util,5m)>70'
              name: 'CPU utilization high'
              priority: WARNING
        - uuid: 3e8ec8a1e9804b35a6ff50ae1d7c63de
          name: 'Disk I/O pressure (1 min)'
          type: DEPENDENT
          key: simovilab.io.psi
          value_type: FLOAT
          units: '%'
          description: |
            Presión de disco (PSI, línea some, promedio de 60 s): porcentaje del tiempo en que al menos un
            proceso esperó por lectura o escritura en disco.
            Reemplaza a system.cpu.util[,iowait], que dentro de un LXC mide el host Proxmox.
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var m = value.match(/^some avg10=[\d.]+ avg60=([\d.]+)/m);
                  if (!m) throw "No hay línea some en el archivo de presión";
                  return m[1];
          master_item:
            key: 'vfs.file.contents[/hostfs/io.pressure]'
          triggers:
            - uuid: 354c01061ff042fba7da4e6eaeb9bf7e
              expression: 'min(/simovilab servidor y sistema operativo/simovilab.io.psi,5m)>{$IO.PSI.CRIT}'
              name: 'Disk I/O pressure is critical'
              priority: HIGH
              description: 'Durante 5 min, procesos esperando disco más del {$IO.PSI.CRIT} % del tiempo.'
            - uuid: c7734e0b886c43d0ab2ede80efbb5d71
              expression: 'min(/simovilab servidor y sistema operativo/simovilab.io.psi,5m)>{$IO.PSI.WARN}'
              name: 'Disk I/O pressure is high'
              priority: WARNING
              description: 'Durante 5 min, procesos esperando disco más del {$IO.PSI.WARN} % del tiempo.'
        - uuid: 929b2c1fb47c421a9ab14894a2c8f85d
          name: 'Memoria libre (disponible)'
          type: DEPENDENT
          key: simovilab.mem.available
          value_type: FLOAT
          units: B
          description: |
            MemAvailable del servidor, en bytes: memoria libre más la caché que el sistema puede liberar
            de inmediato. Es la memoria que de verdad pueden usar las aplicaciones (columna available de free -h).
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var a = value.match(/^MemAvailable:\s+(\d+)/m);
                  if (!a) throw "MemAvailable no está en /proc/meminfo";
                  return a[1] * 1024;
          master_item:
            key: 'vfs.file.contents[/hostfs/meminfo]'
        - uuid: bbbfc3d6520145d5b6e0df770ed43c55
          name: 'Memoria: usada + libre = total'
          type: DEPENDENT
          key: simovilab.mem.html
          history: 1d
          value_type: TEXT
          description: 'Resumen de memoria en HTML para el dashboard: usada más libre (disponible) igual a total, en GiB.'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var t = value.match(/^MemTotal:\s+(\d+)/m), a = value.match(/^MemAvailable:\s+(\d+)/m);
                  if (!t || !a) throw "Faltan MemTotal o MemAvailable en /proc/meminfo";
                  var tot = +t[1], lib = +a[1], usa = tot - lib;
                  function g(kb) { return (kb / 1048576).toFixed(2) + " GiB"; }
                  var td = "<td style='padding:2px 8px'>", tr = "<td style='padding:2px 8px;text-align:right'>";
                  return "<table style='font-size:16px;font-family:monospace;border-collapse:collapse'>"
                    + "<tr>" + td + "</td>" + td + "Usada</td>" + tr + g(usa) + "</td></tr>"
                    + "<tr>" + td + "+</td>" + td + "Libre</td>" + tr + g(lib) + "</td></tr>"
                    + "<tr><td colspan='3' style='border-top:2px solid #888'></td></tr>"
                    + "<tr>" + td + "=</td>" + td + "<b>Total</b></td>" + tr + "<b>" + g(tot) + "</b></td></tr>"
                    + "</table>";
          master_item:
            key: 'vfs.file.contents[/hostfs/meminfo]'
        - uuid: 57848c5a7c2342a287b0dfb1a393e346
          name: 'Memory utilization (% used)'
          type: DEPENDENT
          key: simovilab.mem.pused
          value_type: FLOAT
          units: '%'
          description: |
            Porcentaje de memoria RAM en uso: (MemTotal - MemAvailable) / MemTotal x 100.
            No cuenta la caché de disco que el sistema puede liberar.
            Reemplaza a vm.memory.size[pused], que en Linux calcula total - free: cuenta la caché como usada
            (en una VM marca cerca de 100 %) y en un LXC, desde Docker, mide el contenedor del agente.
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var t = value.match(/^MemTotal:\s+(\d+)/m), a = value.match(/^MemAvailable:\s+(\d+)/m);
                  if (!t || !a) throw "Faltan MemTotal o MemAvailable en /proc/meminfo";
                  return (100 * (t[1] - a[1]) / t[1]).toFixed(2);
          master_item:
            key: 'vfs.file.contents[/hostfs/meminfo]'
          triggers:
            - uuid: 7012578224c94842a1907ea4279ec6b9
              expression: 'min(/simovilab servidor y sistema operativo/simovilab.mem.pused,5m)>90'
              name: 'Memory utilization critical'
              priority: HIGH
            - uuid: d26831e891b34299aea14c16aa9b80cf
              expression: 'min(/simovilab servidor y sistema operativo/simovilab.mem.pused,5m)>75'
              name: 'Memory utilization high'
              priority: WARNING
        - uuid: 987e6c317d774265885c25b251dfacaf
          name: 'Memoria total'
          type: DEPENDENT
          key: simovilab.mem.total
          value_type: FLOAT
          units: B
          description: 'MemTotal del servidor, en bytes.'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var t = value.match(/^MemTotal:\s+(\d+)/m);
                  if (!t) throw "MemTotal no está en /proc/meminfo";
                  return t[1] * 1024;
          master_item:
            key: 'vfs.file.contents[/hostfs/meminfo]'
        - uuid: da562a8041064673864bcd2a88d11f56
          name: 'Memoria usada'
          type: DEPENDENT
          key: simovilab.mem.used
          value_type: FLOAT
          units: B
          description: 'Memoria total menos memoria disponible, en bytes. No cuenta la caché de disco que el sistema puede liberar.'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var t = value.match(/^MemTotal:\s+(\d+)/m), a = value.match(/^MemAvailable:\s+(\d+)/m);
                  if (!t || !a) throw "Faltan MemTotal o MemAvailable en /proc/meminfo";
                  return (t[1] - a[1]) * 1024;
          master_item:
            key: 'vfs.file.contents[/hostfs/meminfo]'
        - uuid: a1ef2cb425574568a0379f6157a62137
          name: Uptime
          type: ZABBIX_ACTIVE
          key: system.uptime
          units: s
          description: |
            Tiempo transcurrido desde el último inicio del sistema operativo, expresado en segundos.
            Se utiliza para detectar reinicios recientes del servidor.
          triggers:
            - uuid: 852e0b9dca5242158ef5ac089d5cbb6b
              expression: 'last(/simovilab servidor y sistema operativo/system.uptime)<300'
              name: 'Server has been restarted recently'
              priority: WARNING
              description: 'El servidor se reinició recientemente. Verificar si el reinicio fue programado o inesperado.'
        - uuid: 788e6c80999240868e371c958b37e3ed
          name: 'CPU: presión (archivo)'
          type: ZABBIX_ACTIVE
          key: 'vfs.file.contents[/hostfs/cpu.pressure]'
          history: 1h
          value_type: TEXT
          description: |
            Copia de la presión de CPU (PSI) del servidor que escribe el timer simovilab-host-stats:
            /sys/fs/cgroup/cpu.pressure en un LXC, /proc/pressure/cpu en VM o servidor físico.
        - uuid: 302357d32c7f4efa8a0cb6481e916a63
          name: 'CPU: uso y núcleos del servidor (archivo)'
          type: ZABBIX_ACTIVE
          key: 'vfs.file.contents[/hostfs/cpu]'
          history: 1h
          value_type: TEXT
          description: |
            Archivo que escribe cada minuto el timer simovilab-host-stats: microsegundos de CPU usados
            (usage_usec de /sys/fs/cgroup/cpu.stat) y cantidad de núcleos (nproc).
            Se usa el cgroup porque dentro de un LXC /proc/stat y /proc/loadavg muestran todo el host
            Proxmox. En una VM o servidor físico el cgroup raíz es el sistema completo.
        - uuid: b69aa5e7b8724279b7ca7c9c468a91d8
          name: 'Disco: presión (archivo)'
          type: ZABBIX_ACTIVE
          key: 'vfs.file.contents[/hostfs/io.pressure]'
          history: 1h
          value_type: TEXT
          description: |
            Copia de la presión de disco (PSI) del servidor que escribe el timer simovilab-host-stats:
            /sys/fs/cgroup/io.pressure en un LXC, /proc/pressure/io en VM o servidor físico.
        - uuid: 65075e3625e54dbcadfbcd2ca9d49c35
          name: 'Memoria: /proc/meminfo del servidor'
          type: ZABBIX_ACTIVE
          key: 'vfs.file.contents[/hostfs/meminfo]'
          history: 1h
          value_type: TEXT
          description: |
            Copia de /proc/meminfo del servidor que escribe cada minuto el timer simovilab-host-stats
            (instalado por zabbix-dev.sh) en /srv/zabbix-disco/meminfo, montado en el agente como /hostfs.
            Se lee del archivo y no de vm.memory.size porque el agente corre en Docker: en un LXC,
            lxcfs le entrega la memoria de su propio contenedor y no la del LXC. Así el dato es el mismo
            en servidor físico, VM, VM en la nube y LXC. Los ítems de memoria dependen de este.
        - uuid: 10c0dc587d174ca19cee5cfec6b9ec43
          name: 'Memoria: última actualización del archivo'
          type: ZABBIX_ACTIVE
          key: 'vfs.file.time[/hostfs/meminfo,modify]'
          units: unixtime
          description: |
            Hora en que el timer simovilab-host-stats escribió por última vez /srv/zabbix-disco/meminfo.
            Si deja de avanzar, los ítems de memoria se quedan con el último valor.
          triggers:
            - uuid: 21029f9ce70c4ce4b59a9f1a217d82ec
              expression: 'now()-last(/simovilab servidor y sistema operativo/vfs.file.time[/hostfs/meminfo,modify])>300 or nodata(/simovilab servidor y sistema operativo/vfs.file.time[/hostfs/meminfo,modify],5m)=1'
              name: 'Datos de memoria sin actualizar'
              priority: WARNING
              description: |
                El archivo /srv/zabbix-disco/meminfo no se actualiza hace más de 5 minutos o el agente no lo puede leer.
                El mismo timer escribe los archivos de CPU y presión, así que esos datos también están congelados.
                Revisar en el servidor: systemctl status simovilab-host-stats.timer
        - uuid: 8ee1e44871c04839ada7457da5bc1d1f
          name: 'Disk space free (/)'
          type: ZABBIX_ACTIVE
          key: 'vfs.fs.size[/hostfs,pfree]'
          delay: 5m
          value_type: FLOAT
          units: '%'
          description: 'Porcentaje de espacio libre del sistema de archivos raíz (/).'
          triggers:
            - uuid: 9a9877bee4c64c47a95521de63591698
              expression: 'max(/simovilab servidor y sistema operativo/vfs.fs.size[/hostfs,pfree],5m)<10'
              name: 'Disk space critical (/)'
              priority: HIGH
            - uuid: d178dd3bf1c74e50bbaaf30afc950302
              expression: 'max(/simovilab servidor y sistema operativo/vfs.fs.size[/hostfs,pfree],5m)<20'
              name: 'Disk space low (/)'
              priority: WARNING
      discovery_rules:
        - uuid: 59680b0210264a4794cc7b4aa7dfe718
          name: 'Contenedores (todos, incluidos los detenidos)'
          type: ZABBIX_ACTIVE
          key: 'docker.containers.discovery[true]'
          delay: 5m
          filter:
            conditions:
              - macro: '{#NAME}'
                value: '{$CONTENEDOR.IGNORAR}'
                operator: NOT_MATCHES_REGEX
          description: |
            Descubre todos los contenedores Docker del host, también los detenidos (parámetro true),
            para alertar cuando uno se apaga o se reinicia. Complementa a Docker by Zabbix agent 2,
            que solo descubre los que están corriendo y solo alerta salidas con código de error.
          item_prototypes:
            - uuid: d5ba951d63514666b8e904993f53fef1
              name: 'Contenedor {#NAME}: info (short)'
              type: ZABBIX_ACTIVE
              key: 'docker.container_info["{#NAME}",short]'
              history: '0'
              value_type: TEXT
              tags:
                - tag: contenedor
                  value: '{#NAME}'
            - uuid: 3f3185c5e7484d8caa969d6a949597d9
              name: 'Contenedor {#NAME}: código de salida'
              type: DEPENDENT
              key: 'simovilab.contenedor.exitcode["{#NAME}"]'
              value_type: FLOAT
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.State.ExitCode
              master_item:
                key: 'docker.container_info["{#NAME}",short]'
              tags:
                - tag: contenedor
                  value: '{#NAME}'
            - uuid: d9461ced450d4560b3cbd370e77c781e
              name: 'Contenedor {#NAME}: reinicios automáticos'
              type: DEPENDENT
              key: 'simovilab.contenedor.restart_count["{#NAME}"]'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.RestartCount
              master_item:
                key: 'docker.container_info["{#NAME}",short]'
              tags:
                - tag: contenedor
                  value: '{#NAME}'
            - uuid: 1dd45f32aa4d4106b71ce07b478618c5
              name: 'Contenedor {#NAME}: corriendo'
              type: DEPENDENT
              key: 'simovilab.contenedor.running["{#NAME}"]'
              valuemap:
                name: 'Contenedor corriendo'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.State.Running
                - type: BOOL_TO_DECIMAL
              master_item:
                key: 'docker.container_info["{#NAME}",short]'
              tags:
                - tag: contenedor
                  value: '{#NAME}'
              trigger_prototypes:
                - uuid: 44e3f169c6ba40a7ad2c5048d54fe1b7
                  expression: 'last(/simovilab servidor y sistema operativo/simovilab.contenedor.running["{#NAME}"])=0'
                  name: 'Contenedor {#NAME} apagado'
                  priority: AVERAGE
                  description: |
                    El contenedor existe pero no está corriendo: se apagó (docker stop, compose
                    down de un servicio) o terminó, con o sin error. Cubre también la salida limpia
                    (código 0), que la plantilla Docker by Zabbix agent 2 no alerta. Para ignorar
                    contenedores que terminan a propósito (p. ej. zabbix-init), ajustar la macro
                    {$CONTENEDOR.IGNORAR}.
            - uuid: 879682cfb42644468f9629dd4a7bb195
              name: 'Contenedor {#NAME}: hora de inicio'
              type: DEPENDENT
              key: 'simovilab.contenedor.started["{#NAME}"]'
              units: unixtime
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.State.StartedAt
              master_item:
                key: 'docker.container_info["{#NAME}",short]'
              tags:
                - tag: contenedor
                  value: '{#NAME}'
          trigger_prototypes:
            - uuid: ab802e609a0046cd9467c21ef22f401d
              expression: 'last(/simovilab servidor y sistema operativo/simovilab.contenedor.running["{#NAME}"])=1 and now()-last(/simovilab servidor y sistema operativo/simovilab.contenedor.started["{#NAME}"])<{$CONTENEDOR.REINICIO.VENTANA}'
              name: 'Contenedor {#NAME} se reinició'
              priority: WARNING
              description: |
                El contenedor arrancó hace menos de {$CONTENEDOR.REINICIO.VENTANA} segundos (cambió su
                hora de inicio): reinicio manual, reinicio automático por una caída o
                reinicio del host. El problema se cierra solo al pasar la ventana.
      tags:
        - tag: simovilab
          value: S.O
      macros:
        - macro: '{$CONTENEDOR.IGNORAR}'
          value: '-init|migrat|-run-'
          description: 'Regex de nombres de contenedor que no se vigilan (terminan a propósito: init, migraciones, docker compose run).'
        - macro: '{$CONTENEDOR.REINICIO.VENTANA}'
          value: '600'
          description: 'Segundos que el problema "se reinició" queda activo después de que el contenedor arranca.'
        - macro: '{$CPU.PSI.CRIT}'
          value: '40'
          description: 'Presión de CPU (% del tiempo esperando CPU, promedio 1 min) para la alerta crítica. Valor inicial: ajustar con el comportamiento medido.'
        - macro: '{$CPU.PSI.WARN}'
          value: '20'
          description: 'Presión de CPU para la alerta de advertencia. En el laboratorio, sin carga anómala, estuvo debajo de 2 %.'
        - macro: '{$IO.PSI.CRIT}'
          value: '40'
          description: 'Presión de disco (% del tiempo esperando disco, promedio 1 min) para la alerta crítica. Valor inicial: ajustar con el comportamiento medido.'
        - macro: '{$IO.PSI.WARN}'
          value: '20'
          description: 'Presión de disco para la alerta de advertencia. En el laboratorio, sin carga anómala, estuvo entre 0 y 5 %.'
      dashboards:
        - uuid: a7328706b64249618e4248544158d239
          name: Servidor
          pages:
            - name: Operación
              widgets:
                - type: gauge
                  name: 'CPU en uso'
                  width: '14'
                  height: '5'
                  fields:
                    - type: INTEGER
                      name: desc_size
                      value: '10'
                    - type: ITEM
                      name: itemid.0
                      value:
                        host: 'simovilab servidor y sistema operativo'
                        key: simovilab.cpu.util
                    - type: STRING
                      name: max
                      value: '100'
                    - type: STRING
                      name: min
                      value: '0'
                    - type: STRING
                      name: thresholds.0.color
                      value: 0EC9AC
                    - type: STRING
                      name: thresholds.0.threshold
                      value: '0'
                    - type: STRING
                      name: thresholds.1.color
                      value: FFD54F
                    - type: STRING
                      name: thresholds.1.threshold
                      value: '70'
                    - type: STRING
                      name: thresholds.2.color
                      value: FF465C
                    - type: STRING
                      name: thresholds.2.threshold
                      value: '90'
                    - type: INTEGER
                      name: value_size
                      value: '30'
                - type: item
                  name: 'Tiempo encendido'
                  'y': '5'
                  width: '24'
                  height: '3'
                  fields:
                    - type: INTEGER
                      name: decimal_size
                      value: '25'
                    - type: ITEM
                      name: itemid.0
                      value:
                        host: 'simovilab servidor y sistema operativo'
                        key: system.uptime
                    - type: INTEGER
                      name: units_size
                      value: '25'
                - type: graph
                  name: 'CPU y memoria'
                  'y': '8'
                  width: '36'
