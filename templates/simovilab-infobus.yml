zabbix_export:
  version: '7.4'
  template_groups:
    - uuid: 19a51f2ca0864028ba21eb9633248ac3
      name: Templates/Simovilab
  templates:
    - uuid: 7c1a9d2e5b4f43a09e8d6c3b1a7f2049
      template: simovilab-infobus
      name: simovilab-infobus
      description: |
        Capa I de MACDT: latencia de la API de InfoBus, medida DESDE DENTRO
        (agente de R2 directo al orchestrator, sin Traefik ni TLS). La
        medicion externa la hace R4 (simovilab-infobus-ext, host Zabbix-server)
        y la resta entre ambas esta aqui (items infobus.net.*). Es el RNF de rendimiento del TFG y el objetivo
        de calibracion de beta.

        La sonda hace 10 peticiones por ciclo porque NextTripView declara
        throttle_scope "realtime" y la cuota es 30/min por IP. El p95 real
        no sale de la rafaga (con n=10 el p95 es el maximo) sino del item
        calculado sobre la serie almacenada.
      groups:
        - name: Templates/Simovilab
      items:
        - uuid: 34da9fced3ce4b3299962be23fa9dac8
          name: 'Sonda de la API de InfoBus'
          type: ZABBIX_ACTIVE
          key: infobus.api
          delay: 60s
          history: 1d
          timeout: 30s
          value_type: TEXT
          description: 'Maestro. 10 peticiones a /api/next-trips/ desde R2, directo al orchestrator. Con --stop-id auto mide la parada con mas horas de paso en 5 h (peor caso). timeout 30s: la sonda tarda mas de 3 s en frio y, una vez por hora, revisa si cambio el GTFS.'
        - uuid: 923b3c60c12f41e18788a94646949fd2
          name: 'Parada medida por la sonda'
          type: DEPENDENT
          key: infobus.api.stop_id
          value_type: CHAR
          history: 90d
          description: 'stop_id consultado en el ciclo. Con --stop-id auto es la parada del peor caso segun el GTFS vigente; cambia solo cuando cambia el GTFS.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.stop_id
              error_handler: DISCARD_VALUE
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          master_item:
            key: infobus.api
        - uuid: ec07fc29dfb44b33b4ca6ba562b59674
          name: 'Horas de paso en 5 h de la parada medida (pico)'
          type: DEPENDENT
          key: infobus.api.stop_pico_5h
          value_type: UNSIGNED
          history: 90d
          description: 'Pico de horas de paso programadas en una ventana de 5 h para la parada medida (lo que carga la consulta next-trips de infobus 9482328).'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.stop_pico_5h
              error_handler: DISCARD_VALUE
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          master_item:
            key: infobus.api
        - uuid: 08da7cf133364d99b616faf4f8323bcb
          name: 'Eleccion automatica de parada activa'
          type: DEPENDENT
          key: infobus.api.stop_auto
          value_type: UNSIGNED
          description: '1 si la parada salio del GTFS; 0 si se uso --stop-id-fallback porque nunca se pudo calcular.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.stop_auto
              error_handler: DISCARD_VALUE
          master_item:
            key: infobus.api
        - uuid: 0e0920e623c043728350dc88d8aeca05
          name: 'Día sin servicio (next-trips responde 204)'
          type: DEPENDENT
          key: infobus.api.sin_servicio
          valuemap:
            name: 'Servicio del día'
          value_type: UNSIGNED
          description: '1 cuando toda la ráfaga respondió 204: el calendario GTFS no tiene servicio hoy (en bUCR, sábado y domingo). Esos ciclos no tienen latencia.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.sin_servicio
              error_handler: DISCARD_VALUE
          master_item:
            key: infobus.api
        - uuid: 69bcb15219e54392ae5df19317c75fd4
          name: 'Tabla API INFOBUS (HTML)'
          type: DEPENDENT
          key: infobus.api.tabla_html
          history: 1d
          value_type: TEXT
          description: 'Tabla HTML con /health/ y next-trips: alive, estado, código HTTP y latencia (200/204). Se muestra en el widget Item history con la columna en modo HTML.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.tabla_html
              error_handler: DISCARD_VALUE
          master_item:
            key: infobus.api
        - uuid: 46315e08d097484b903040c1c0e309c2
          name: 'API de InfoBus responde correctamente'
          type: DEPENDENT
          key: infobus.api.ok
          valuemap:
            name: 'Estado API'
          value_type: UNSIGNED
          description: '1 si las 10 peticiones devolvieron 200 con cuerpo, o 204 (día sin servicio, respuesta correcta de infobus). Ver infobus.api.sin_servicio.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.ok
              error_handler: DISCARD_VALUE
          master_item:
            key: infobus.api
          triggers:
            - uuid: 2b3396876e1b4dcab3edccee1e0b5ad5
              expression: 'last(/simovilab-infobus/infobus.api.ok)=0'
              name: 'La API de InfoBus no responde correctamente'
              priority: HIGH
              description: |
                Puede ser el servicio, o un stop_id mal configurado en la sonda:
                NextTripView responde 404 si la parada no existe en la base.
        - uuid: cd8211b1403b48748e997ceadfedba8f
          name: 'L_api p50 del ciclo'
          type: DEPENDENT
          key: infobus.api.lat_p50
          units: ms
          value_type: FLOAT
          description: 'Tendencia central del ciclo. Es el regresor para calibrar beta.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.lat_p50_ms
              error_handler: DISCARD_VALUE
            - type: MATCHES_REGEX
              parameters:
                - '^-?[0-9]+(\.[0-9]+)?$'
              error_handler: DISCARD_VALUE
          master_item:
            key: infobus.api
        - uuid: 8c5c7829ba894b21b4dfc2b713e9c1b3
          name: 'Latencia en día sin servicio (respuestas 204)'
          type: DEPENDENT
          key: infobus.api.lat_sin_servicio
          units: ms
          value_type: FLOAT
          description: 'Mediana de las respuestas 204 del ciclo. Sin servicio, next-trips solo hace 4 consultas fijas (feed, parada, agencia, calendario): mide el costo fijo de la petición (T_0) sin el costo de las horas de paso. Vacío en días hábiles.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.lat_sin_servicio_p50_ms
              error_handler: DISCARD_VALUE
            - type: MATCHES_REGEX
              parameters:
                - '^-?[0-9]+(\.[0-9]+)?$'
              error_handler: DISCARD_VALUE
          master_item:
            key: infobus.api
          triggers:
            - uuid: bbb1292c2c6940f6b8cd9ea56f4e9084
              expression: 'avg(/simovilab-infobus/infobus.api.lat_sin_servicio,10m)>{$INFOBUS.T204.FACTOR}*percentile(/simovilab-infobus/infobus.api.lat_sin_servicio,1d,50)'
              name: 'Latencia de día sin servicio fuera de lo normal (204)'
              priority: WARNING
              description: |
                Sin servicio, next-trips responde 204 con 4 consultas fijas, así que su
                tiempo debe ser casi constante (es el costo fijo T_0). Se dispara cuando el
                promedio de 10 min supera {$INFOBUS.T204.FACTOR} veces la mediana del
                último día. Un pico aquí no lo explica el horario: revisar carga del
                servidor, base de datos o red de infobus.
        - uuid: 4bef03e67e88483da7cd53d216f08a29
          name: 'L_api p90 del ciclo'
          type: DEPENDENT
          key: infobus.api.lat_p90
          units: ms
          value_type: FLOAT
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.lat_p90_ms
              error_handler: DISCARD_VALUE
            - type: MATCHES_REGEX
              parameters:
                - '^-?[0-9]+(\.[0-9]+)?$'
              error_handler: DISCARD_VALUE
          master_item:
            key: infobus.api
        - uuid: 129f1485684a4a578c3b4a6add6cc618
          name: 'L_api maxima del ciclo'
          type: DEPENDENT
          key: infobus.api.lat_max
          units: ms
          value_type: FLOAT
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.lat_max_ms
              error_handler: DISCARD_VALUE
            - type: MATCHES_REGEX
              parameters:
                - '^-?[0-9]+(\.[0-9]+)?$'
              error_handler: DISCARD_VALUE
          master_item:
            key: infobus.api
        - uuid: 4ff28ccfec0941c8b1fea42949a4e3b1
          name: 'Costo de la consulta, aislado del transporte'
          type: DEPENDENT
          key: infobus.api.query_p50
          units: ms
          value_type: FLOAT
          description: |
            lat_p50 menos health_ms (con la conexion ya abierta). Aisla el costo
            de la consulta del piso de transporte, que no depende de la carga.
            Es lo que beta pretende modelar.
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.query_p50_ms
              error_handler: DISCARD_VALUE
            - type: MATCHES_REGEX
              parameters:
                - '^-?[0-9]+(\.[0-9]+)?$'
              error_handler: DISCARD_VALUE
          master_item:
            key: infobus.api
        - uuid: dbd0683ceb1641aabec2053b43279e39
          name: 'Piso de transporte, conexion abierta'
          type: DEPENDENT
          key: infobus.api.health_ms
          units: ms
          value_type: FLOAT
          description: '/health/ reusando la conexion. Vista Django plana, sin throttling de DRF.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.health_ms
              error_handler: DISCARD_VALUE
            - type: MATCHES_REGEX
              parameters:
                - '^-?[0-9]+(\.[0-9]+)?$'
              error_handler: DISCARD_VALUE
          master_item:
            key: infobus.api
        - uuid: 19a0d26a50b44c109f755f6729dcdacd
          name: 'Primera peticion de la sesion (abre la conexion)'
          type: DEPENDENT
          key: infobus.api.health_cold_ms
          units: ms
          value_type: FLOAT
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.health_cold_ms
              error_handler: DISCARD_VALUE
            - type: MATCHES_REGEX
              parameters:
                - '^-?[0-9]+(\.[0-9]+)?$'
              error_handler: DISCARD_VALUE
          master_item:
            key: infobus.api
        - uuid: 8e71c756e0dc4830ae52519da53ca317
          name: 'Costo de abrir la conexión (DNS + TCP)'
          type: DEPENDENT
          key: infobus.api.setup_ms
          units: ms
          value_type: FLOAT
          description: 'health_cold_ms - health_ms: resolver el nombre (DNS de Docker) y el saludo TCP antes de la primera petición. Desde dentro de la red Docker y por http (sin TLS). Medido 2026-11-07: mediana 4.4 ms, p95 7.5 ms. Puede salir negativo (2-3 % de las muestras): es una sola resta entre dos peticiones y el ruido es de unos ±3 ms.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.setup_ms
              error_handler: DISCARD_VALUE
            - type: MATCHES_REGEX
              parameters:
                - '^-?[0-9]+(\.[0-9]+)?$'
              error_handler: DISCARD_VALUE
          master_item:
            key: infobus.api
          triggers:
            - uuid: 5947d207697e4de1920d0ff36c82d360
              expression: 'avg(/simovilab-infobus/infobus.api.setup_ms,10m)>{$INFOBUS.SETUP.FACTOR}*percentile(/simovilab-infobus/infobus.api.setup_ms,1d,50) and avg(/simovilab-infobus/infobus.api.setup_ms,10m)>{$INFOBUS.SETUP.MIN_MS}'
              name: 'Costo de abrir la conexión fuera de lo normal'
              priority: WARNING
              description: |
                El promedio de 10 min supera {$INFOBUS.SETUP.FACTOR} veces la mediana del último
                día (medido 2026-11-07: mediana 4.4 ms, así que dispara sobre ~9 ms). También
                exige superar {$INFOBUS.SETUP.MIN_MS} ms, para no alertar si la mediana fuera
                muy baja. Revisar DNS de Docker, red del host o saturación del servidor web
                (aceptar conexiones nuevas).
        - uuid: 38675e6d46ff4483a6164904d5f18580
          name: 'Disponibilidad de /health/'
          type: DEPENDENT
          key: infobus.api.health_ok
          valuemap:
            name: 'Estado API'
          value_type: UNSIGNED
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.health_ok
              error_handler: DISCARD_VALUE
          master_item:
            key: infobus.api
        - uuid: e9db3dd0d0cb4988ae012b4ebbfa9b3b
          name: 'Too Many Requests (429): peticiones rechazadas por la cuota'
          type: DEPENDENT
          key: infobus.api.throttled
          value_type: UNSIGNED
          description: 'Si pasa de 0, la medicion del ciclo no es valida.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.throttled
              error_handler: DISCARD_VALUE
          master_item:
            key: infobus.api
          triggers:
            - uuid: 3236bfe193a8489e85d04a9e791189e2
              expression: 'last(/simovilab-infobus/infobus.api.throttled)>0'
              name: 'La sonda agota su cuota: la medicion no es valida'
              priority: WARNING
              description: |
                Bajar --repeat o subir el intervalo. Mientras dispare, L_api no
                sirve como dato: se esta midiendo el 429, no la latencia.
        - uuid: 9be8a046e08a43b89b2d1ac87fe21525
          name: 'L_api p95 real, ventana de 1 h'
          type: CALCULATED
          key: infobus.api.lat_p95_1h
          units: ms
          value_type: FLOAT
          params: 'percentile(//infobus.api.lat_p50,1h,95)'
          description: 'El p95 del RNF. ~600 muestras por hora.'
          triggers:
            - uuid: 98edfb6df538451480794907aadbe5f5
              expression: 'last(/simovilab-infobus/infobus.api.lat_p95_1h)>{$T_LATENCY_WARN}'
              name: 'L_api p95 sobre el umbral adaptativo de MACDT'
              priority: WARNING
              dependencies:
                - name: 'La API de InfoBus no responde correctamente'
                  expression: 'last(/simovilab-infobus/infobus.api.ok)=0'
                - name: 'La sonda agota su cuota: la medicion no es valida'
                  expression: 'last(/simovilab-infobus/infobus.api.throttled)>0'
            - uuid: 3e04749615074eab87a0535f08e0e027
              expression: 'last(/simovilab-infobus/infobus.api.lat_p95_1h)>{$T_LATENCY_CRIT}'
              name: 'L_api p95 incumple el RNF de 200 ms'
              priority: AVERAGE
              dependencies:
                - name: 'La API de InfoBus no responde correctamente'
                  expression: 'last(/simovilab-infobus/infobus.api.ok)=0'
                - name: 'La sonda agota su cuota: la medicion no es valida'
                  expression: 'last(/simovilab-infobus/infobus.api.throttled)>0'
        - uuid: 9417862345c64a3e8332638a5838c0f5
          name: 'Conexion TCP al orchestrator'
          type: DEPENDENT
          key: infobus.api.tcp_connect_ms
          units: ms
          value_type: FLOAT
          description: 'Desde dentro, en la red Docker: debe ser casi cero.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.tcp_connect_ms
              error_handler: DISCARD_VALUE
            - type: MATCHES_REGEX
              parameters:
                - '^-?[0-9]+(\.[0-9]+)?$'
              error_handler: DISCARD_VALUE
          master_item:
            key: infobus.api
        - uuid: be2242d75ea4436483a48c06969e06a2
          name: 'Red: RTT de R4 a R2, promedio 15 min'
          type: CALCULATED
          key: infobus.net.rtt_ms
          delay: 1m
          value_type: FLOAT
          units: ms
          params: 'avg(/Zabbix-server/infobus.api.ext.tcp_connect_ms,15m)'
          description: 'Conexion TCP de R4 al 443 de R2. Zabbix-server es el nombre fijo del host del servidor (LOCAL_HOST_NAME).'
        - uuid: 556cdd6a9e9345069f1f96596c926dce
          name: 'Externo - interno: red + TLS + Traefik'
          type: CALCULATED
          key: infobus.net.delta_ms
          delay: 1m
          value_type: FLOAT
          units: ms
          params: 'avg(/Zabbix-server/infobus.api.ext.health_ms,15m) - avg(//infobus.api.health_ms,15m)'
          description: |
            Resta de los pisos de transporte con la conexion abierta (/health/, sin consulta a la base),
            promediados 15 min porque las dos sondas no corren en el mismo segundo.
        - uuid: 085e5649f59042cc95db0551d9647c07
          name: 'TLS + Traefik (sin red)'
          type: CALCULATED
          key: infobus.net.tls_traefik_ms
          delay: 1m
          value_type: FLOAT
          units: ms
          params: 'last(//infobus.net.delta_ms) - last(//infobus.net.rtt_ms)'
          description: 'Externo - interno, menos el RTT de red.'
        - uuid: faa0bd3f5cd54b55a856229001b5efd6
          name: 'Estado del bucle MACDT'
          type: TRAP
          key: macdt.status
          value_type: UNSIGNED
          description: |
            1 = el ciclo calculo y escribio el umbral.
            0 = ciclo degradado: dato de rho ausente o viejo, o fallo de API.
            En degradado el umbral vigente se conserva; no se escribe nada.
          valuemap:
            name: 'Estado MACDT'
          triggers:
            - uuid: 17d29d1dd90c46aa95fb7a508c5bb616
              expression: 'last(/simovilab-infobus/macdt.status)=0'
              name: 'MACDT degradado: el umbral no se esta actualizando'
              priority: WARNING
              description: |
                El bucle sigue vivo pero no pudo calcular: rho sin dato o viejo,
                o fallo del API. Los triggers de latencia siguen operando con el
                ultimo umbral valido.
            - uuid: a190e9f925fe487891ea0bc2373bf4d1
              expression: 'nodata(/simovilab-infobus/macdt.status,5m)=1'
              name: 'El bucle MACDT no reporta: puede estar caido'
              priority: AVERAGE
              description: |
                Distinto del anterior: aqui no llega ni el estado de degradado.
                Un contenedor muerto se ve igual que un sistema sano sin este trigger.
        - uuid: fb1120a1e6d041b8ad94406cf80af8dc
          name: 'T_warn escrito por MACDT'
          type: TRAP
          key: macdt.t_warn
          units: ms
          value_type: FLOAT
          description: 'El valor que el bucle puso en la macro de host. Para graficarlo contra rho.'
      macros:
        - macro: '{$INFOBUS.SETUP.FACTOR}'
          value: '2'
          description: 'Veces la mediana diaria del costo de abrir la conexión que dispara la alerta.'
        - macro: '{$INFOBUS.SETUP.MIN_MS}'
          value: '5'
          description: 'Mínimo en ms para alertar el costo de abrir la conexión (piso por si la mediana diaria es muy baja).'
        - macro: '{$INFOBUS.T204.FACTOR}'
          value: '2'
          description: 'Veces la mediana diaria de la latencia 204 que dispara la alerta de día sin servicio.'
        - macro: '{$T_LATENCY_WARN}'
          value: '130'
          description: 'Semilla igual a T_BASE. Lo sobrescribe el bucle MACDT en F5.'
        - macro: '{$T_LATENCY_CRIT}'
          value: '200'
          description: 'Fijo en el RNF. No lo mueve MACDT.'
        - macro: '{$MACDT.T_BASE}'
          value: '130'
          description: 'PROVISIONAL. Sale de la linea base de 7 dias.'
        - macro: '{$MACDT.T_FLOOR}'
          value: '130'
          description: 'Piso del umbral. Igual a T_BASE.'
        - macro: '{$MACDT.T_RNF}'
          value: '200'
          description: 'Techo contractual. No se mueve.'
        - macro: '{$MACDT.BETA}'
          value: '0.35'
          description: 'PROVISIONAL. Se deriva de la regresion query_p50 contra rho.'
        - macro: '{$MACDT.F_CRIT}'
          value: '0.7'
          description: 'Endurecimiento del umbral con cobertura GPS bajo 70 %.'
        - macro: '{$Q_WARN}'
          value: '80'
          description: 'Longitud del stream events de Redis. Pendiente del agente en R2.'
        - macro: '{$Q_CRIT}'
          value: '150'
          description: 'ídem'
      dashboards:
        - uuid: 486967a74607447290830f37d336c4bf
          name: 'Operación infobus'
          pages:
            - name: 'Operación'
              widgets:
                - type: item
                  name: 'T_LATENCY_WARN actual (escrito por MACDT)'
                  x: '0'
                  y: '0'
                  width: '18'
                  height: '3'
                  fields:
                    - type: ITEM
                      name: itemid.0
                      value:
                        host: 'simovilab-infobus'
                        key: 'macdt.t_warn'
                    - type: INTEGER
                      name: value_size
                      value: '25'
                    - type: INTEGER
                      name: decimal_size
                      value: '25'
                    - type: INTEGER
                      name: units_size
                      value: '25'
                    - type: STRING
                      name: bg_color
                      value: '1F2937'
                    - type: STRING
                      name: value_color
                      value: 'FFFFFF'
                    - type: STRING
                      name: units_color
                      value: 'FFFFFF'
                    - type: STRING
                      name: desc_color
                      value: 'FFFFFF'
                    - type: STRING
                      name: time_color
                      value: 'FFFFFF'
                    - type: STRING
                      name: reference
                      value: OKOSG
                - type: clock
                  name: 'Hora local'
                  x: '18'
                  y: '0'
                  width: '18'
                  height: '3'
                  fields:
                    - type: INTEGER
                      name: clock_type
                      value: '1'
                    - type: INTEGER
                      name: show.0
                      value: '1'
                    - type: INTEGER
                      name: show.1
                      value: '2'
                    - type: INTEGER
                      name: time_format
                      value: '1'
                    - type: STRING
                      name: bg_color
                      value: '1F2937'
                    - type: STRING
                      name: date_color
                      value: 'FFFFFF'
                    - type: STRING
                      name: time_color
                      value: 'FFFFFF'
                    - type: INTEGER
                      name: time_bold
                      value: '1'
                - type: item
                  name: 'Estado del bucle MACDT'
                  x: '36'
                  y: '0'
                  width: '18'
                  height: '3'
                  fields:
                    - type: ITEM
                      name: itemid.0
                      value:
                        host: 'simovilab-infobus'
                        key: 'macdt.status'
                    - type: INTEGER
                      name: value_size
                      value: '25'
                    - type: INTEGER
                      name: decimal_size
                      value: '25'
                    - type: INTEGER
                      name: units_size
                      value: '25'
                    - type: STRING
                      name: reference
                      value: QHUJP
                - type: item
                  name: 'L_api p95 (última hora)'
                  x: '54'
                  y: '0'
                  width: '18'
                  height: '3'
                  fields:
                    - type: ITEM
                      name: itemid.0
                      value:
                        host: 'simovilab-infobus'
                        key: 'infobus.api.lat_p95_1h'
                    - type: INTEGER
                      name: value_size
                      value: '25'
