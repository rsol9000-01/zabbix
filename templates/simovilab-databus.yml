      dependencies:
        - name: 'Capa D: feed GTFS-RT no alcanzable'
          expression: last(/simovilab-databus/gtfs.fetch_ok)=0
        - name: 'Capa D: sonda sin datos'
          expression: 'nodata(/simovilab-databus/gtfs.probe[{$MACDT.STALE_S}],5m)=1'
    - uuid: c55d8ed4f8e046c2843159fa995ca3eb
      expression: 'min(/simovilab-databus/gtfs.v_trips,5m)>last(/simovilab-databus/macdt.v_trips_max)'
