    - uuid: 2982be5f6b4044bb8514e2c5c9997e54
      expression: 'last(/simovilab-databus/macdt.gate)=1 and last(/simovilab-databus/macdt.s_t)>=1 and max(/simovilab-databus/gtfs.v_trips,3m)=0'
