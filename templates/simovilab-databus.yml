      expression: 'last(/simovilab-databus/macdt.gate)=1 and last(/simovilab-databus/macdt.s_t)>=2 and (min(/simovilab-databus/macdt.s_t,5m)-max(/simovilab-databus/gtfs.v_trips,5m))>=last(/simovilab-databus/macdt.s_t)/2'
      name: 'Déficit de viajes'
