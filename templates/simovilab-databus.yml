zabbix_export:
  version: '7.4'
  template_groups:
    - uuid: 19a51f2ca0864028ba21eb9633248ac3
      name: Templates/Simovilab
  templates:
    - uuid: 5eb6213b9821476c8690cd4bec8babd9
      template: simovilab-databus
      name: simovilab-databus
      groups:
        - name: Templates/Simovilab
      items:
        - uuid: b196dceecaa245f9bb02dfa2cc4b7b52
          name: 'GTFS estático publicado por databus'
          type: ZABBIX_ACTIVE
          key: databus.static
          delay: 5m
          history: 1d
          value_type: TEXT
        - uuid: 3d045ed757e3448383fd38c38131a93f
          name: 'databus: antigüedad del estático'
          type: DEPENDENT
          key: databus.static.age_s
          value_type: FLOAT
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.static_zip_age_s
              error_handler: DISCARD_VALUE
            - type: MATCHES_REGEX
              parameters:
                - '^-?[0-9]+(\.[0-9]+)?$'
              error_handler: DISCARD_VALUE
          master_item:
            key: databus.static
        - uuid: b7db7517416e4d808e2b1fe3d92e9ae7
          name: 'databus: desfase del estático frente a la fuente'
          type: CALCULATED
          key: databus.static.desfase_s
          delay: 5m
          value_type: FLOAT
          units: s
          params: 'last(//databus.static.age_s) - last(//macdt.static_zip_age_s)'
          triggers:
            - uuid: 5cbbc7f23c704a9d9eba788d67a7de4e
              expression: 'min(/simovilab-databus/databus.static.desfase_s,15m)>{$MACDT.ZIP.DESFASE.WARN}'
              name: 'El GTFS que publica databus está desactualizado'
              dependencies:
                - name: 'SIMOVI no sirve el GTFS estático'
                  expression: last(/simovilab-databus/macdt.static_zip_http)<>200
                - name: 'databus no publica el GTFS estático'
                  expression: last(/simovilab-databus/databus.static.http)<>200
        - uuid: 5cd27a5a2ccd4781bae8e48cd15921db
          name: 'databus: código HTTP del estático'
          type: DEPENDENT
          key: databus.static.http
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.static_zip_http
              error_handler: DISCARD_VALUE
          master_item:
            key: databus.static
          triggers:
            - uuid: ae8592f688154782b9e57f3ed1c11f0c
              expression: last(/simovilab-databus/databus.static.http)<>200
              name: 'databus no publica el GTFS estático'
              priority: AVERAGE
              description: 'El feed.zip que publica databus (/feed/schedule/feed.zip) no devolvió 200. Hoy databus no lo genera, así que esta alerta queda activa hasta que lo haga.'
        - uuid: d3c7378b4fb04a839608eacf51f16c29
          name: 'databus: lectura del estático correcta'
          type: DEPENDENT
          key: databus.static.ok
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.window_ok
              error_handler: DISCARD_VALUE
          master_item:
            key: databus.static
        - uuid: 9c6a80ec3d2d47919e07417af235fffa
          name: 'V_completeness de predicciones'
          type: DEPENDENT
          key: gtfs.completeness_tu_pct
          value_type: FLOAT
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.v_completeness_tu_pct
              error_handler: DISCARD_VALUE
            - type: MATCHES_REGEX
              parameters:
                - '^-?[0-9]+(\.[0-9]+)?$'
              error_handler: DISCARD_VALUE
          master_item:
            key: 'gtfs.probe[{$MACDT.STALE_S}]'
        - uuid: a7e3e0ad4a144978a0489e01ac0dae42
          name: 'V_completeness de posiciones'
          type: DEPENDENT
          key: gtfs.completeness_vp_pct
          value_type: FLOAT
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.v_completeness_vp_pct
              error_handler: DISCARD_VALUE
            - type: MATCHES_REGEX
              parameters:
                - '^-?[0-9]+(\.[0-9]+)?$'
              error_handler: DISCARD_VALUE
          master_item:
            key: 'gtfs.probe[{$MACDT.STALE_S}]'
        - uuid: 57d014534aa643bd8158d819ba0a409e
          name: 'Calibrar el --stale contra la cadencia real'
          type: DEPENDENT
          key: gtfs.data_age_p95_s
          value_type: FLOAT
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.data_age_p95_s
              error_handler: DISCARD_VALUE
            - type: MATCHES_REGEX
              parameters:
                - '^-?[0-9]+(\.[0-9]+)?$'
              error_handler: DISCARD_VALUE
          master_item:
            key: 'gtfs.probe[{$MACDT.STALE_S}]'
        - uuid: 77455c60df804f9ab0a5a9bcecb36767
          name: 'V_age del publicador de predicciones'
          type: DEPENDENT
          key: gtfs.feed_age_tu_s
          value_type: FLOAT
          units: s
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.feed_age_tu_s
              error_handler: DISCARD_VALUE
            - type: MATCHES_REGEX
              parameters:
                - '^-?[0-9]+(\.[0-9]+)?$'
              error_handler: DISCARD_VALUE
          master_item:
            key: 'gtfs.probe[{$MACDT.STALE_S}]'
          triggers:
            - uuid: efad2902e2af46d1be1ea9a77b235008
              expression: 'min(/simovilab-databus/gtfs.feed_age_tu_s,3m)>{$MACDT.V_AGE.WARN}'
              name: 'Feed GTFS-RT atrasado'
              priority: WARNING
              description: 'Depende de los dos primeros'
              dependencies:
                - name: 'Capa D: feed GTFS-RT no alcanzable'
                  expression: last(/simovilab-databus/gtfs.fetch_ok)=0
                - name: 'Capa D: sonda sin datos'
                  expression: 'nodata(/simovilab-databus/gtfs.probe[{$MACDT.STALE_S}],5m)=1'
            - uuid: 61525e6b5b024f529e155002e5bdaf0f
              expression: 'min(/simovilab-databus/gtfs.feed_age_tu_s,3m)>{$MACDT.V_AGE.CRIT}'
              name: 'Feed GTFS-RT muy atrasado'
              priority: HIGH
              description: 'Depende del anterior'
              dependencies:
                - name: 'Feed GTFS-RT atrasado'
                  expression: 'min(/simovilab-databus/gtfs.feed_age_tu_s,3m)>{$MACDT.V_AGE.WARN}'
        - uuid: 477b4b369f6548ac87bfa2f27c363bb4
          name: 'V_age del publicador de posiciones'
          type: DEPENDENT
          key: gtfs.feed_age_vp_s
          value_type: FLOAT
          units: s
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.feed_age_vp_s
              error_handler: DISCARD_VALUE
            - type: MATCHES_REGEX
              parameters:
                - '^-?[0-9]+(\.[0-9]+)?$'
              error_handler: DISCARD_VALUE
          master_item:
            key: 'gtfs.probe[{$MACDT.STALE_S}]'
        - uuid: ac8bd068c7fa4632bbb5d1d5aa5d4821
          name: 'Raíz del árbol de alertas'
          type: DEPENDENT
          key: gtfs.fetch_ok
          valuemap:
               name: 'Estado feed GTFS-RT'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.fetch_ok
              error_handler: DISCARD_VALUE
          master_item:
            key: 'gtfs.probe[{$MACDT.STALE_S}]'
          triggers:
            - uuid: 82cc484e671b4469b52e6c23f1b15f69
              expression: last(/simovilab-databus/gtfs.fetch_ok)=0
              name: 'Capa D: feed GTFS-RT no alcanzable'
              priority: HIGH
        - uuid: afe91d228ced4331bf84cbeb878edd7f
          name: 'Latencia del endpoint de predicciones'
          type: DEPENDENT
          key: gtfs.fetch_tu_ms
          value_type: FLOAT
          units: ms
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.fetch_tu_ms
              error_handler: DISCARD_VALUE
          master_item:
            key: 'gtfs.probe[{$MACDT.STALE_S}]'
        - uuid: 1265b51a1ea54b73a8101576b458f79e
          name: 'Latencia del endpoint de posiciones'
          type: DEPENDENT
          key: gtfs.fetch_vp_ms
          value_type: FLOAT
          units: ms
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.fetch_vp_ms
              error_handler: DISCARD_VALUE
          master_item:
            key: 'gtfs.probe[{$MACDT.STALE_S}]'
        - uuid: ad123756995f412aadec85af1734c392
          name: gtfs-Maestro
          type: ZABBIX_ACTIVE
          key: 'gtfs.probe[{$MACDT.STALE_S}]'
          timeout: 30s
          value_type: TEXT
          triggers:
            - uuid: 08dbb1cc37cc40bbadc195148ca17da2
              expression: 'nodata(/simovilab-databus/gtfs.probe[{$MACDT.STALE_S}],5m)=1'
              name: 'Capa D: sonda sin datos'
              priority: HIGH
              description: 'Si el servidor no responde al ping, esta alerta queda suprimida por Server DOWN!!!.'
              dependencies:
                - name: 'Server DOWN!!!'
                  expression: 'max(/simovilab servidor y sistema operativo/icmpping[,3],#3)=0'
                  recovery_expression: 'last(/simovilab servidor y sistema operativo/icmpping[,3])=1'
        - uuid: f5eb2be0af924315b4dd3665610fac7a
          name: 'Sospecha de relleno de timestamps'
          type: DEPENDENT
          key: gtfs.ts_igual_header_pct
          value_type: FLOAT
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.ts_igual_header_pct
              error_handler: DISCARD_VALUE
            - type: MATCHES_REGEX
              parameters:
                - '^-?[0-9]+(\.[0-9]+)?$'
              error_handler: DISCARD_VALUE
          master_item:
            key: 'gtfs.probe[{$MACDT.STALE_S}]'
        - uuid: d9befc0de79f4b8c8805ceb46024d79c
          name: 'V_gps. Entrada de F_crit'
          type: DEPENDENT
          key: gtfs.v_gps_pct
          value_type: FLOAT
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.v_gps_pct
              error_handler: DISCARD_VALUE
            - type: MATCHES_REGEX
              parameters:
                - '^-?[0-9]+(\.[0-9]+)?$'
              error_handler: DISCARD_VALUE
          master_item:
            key: 'gtfs.probe[{$MACDT.STALE_S}]'
        - uuid: d791b34261844ac3b04998eed6b32b43
          name: 'V_trips. Entrada de F_load y G_load'
          type: DEPENDENT
          key: gtfs.v_trips
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.v_trips
              error_handler: DISCARD_VALUE
          master_item:
            key: 'gtfs.probe[{$MACDT.STALE_S}]'
        - uuid: 29f21536310440bfb62cee6282bac73f
          name: 'Denominador real de V_gps'
          type: DEPENDENT
          key: gtfs.v_vehicles
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.v_vehicles
              error_handler: DISCARD_VALUE
          master_item:
            key: 'gtfs.probe[{$MACDT.STALE_S}]'
        - uuid: f43b0a2f609e451c87eaea995d41ce7a
          name: 'Vehículos con GPS fresco'
          type: DEPENDENT
          key: gtfs.v_gps_frescos
          value_type: UNSIGNED
          description: 'Vehículos del feed con posición de hace --stale segundos o menos (60 s). Numerador de V_gps.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.v_gps_frescos
              error_handler: DISCARD_VALUE
          master_item:
            key: 'gtfs.probe[{$MACDT.STALE_S}]'
        - uuid: 19e1a95eb3614a53b6e43f02ecf3d9d0
          name: 'Vehículos con GPS viejo'
          type: DEPENDENT
          key: gtfs.v_gps_viejos
          value_type: UNSIGNED
          description: 'Vehículos del feed con posición de hace más de --stale segundos (o con hora en el futuro). Un viaje que terminó y databus no cerró aparece aquí.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.v_gps_viejos
              error_handler: DISCARD_VALUE
          master_item:
            key: 'gtfs.probe[{$MACDT.STALE_S}]'
        - uuid: 10b40d6e387d4ed0afe08e8449f7820a
          name: 'Vehículos sin timestamp'
          type: DEPENDENT
          key: gtfs.v_gps_sin_ts
          value_type: UNSIGNED
          description: 'Vehículos del feed sin hora en su posición: no se puede saber si el dato es actual.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.v_gps_sin_ts
              error_handler: DISCARD_VALUE
          master_item:
            key: 'gtfs.probe[{$MACDT.STALE_S}]'
        - uuid: 5e8c5db255cd49a3aebd48b2368cc3ee
          name: 'Viajes sin paradas por delante'
          type: DEPENDENT
          key: gtfs.v_trips_sin_paradas
          value_type: UNSIGNED
          description: 'Viajes del feed de predicciones sin ninguna parada pendiente. Si se mantienen, el viaje terminó y databus no lo cerró: inflan V_trips y rho.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.v_trips_sin_paradas
              error_handler: DISCARD_VALUE
          master_item:
            key: 'gtfs.probe[{$MACDT.STALE_S}]'
        - uuid: 745852326cbc45668f28f43fcc0db5d2
          name: 'Umbral de GPS fresco usado por la sonda'
          type: DEPENDENT
          key: gtfs.stale_s
          value_type: UNSIGNED
          units: s
          description: 'Valor de --stale con el que corrió la sonda (viene de la macro {$MACDT.STALE_S}).'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.stale_s
              error_handler: DISCARD_VALUE
          master_item:
            key: 'gtfs.probe[{$MACDT.STALE_S}]'
        - uuid: f4471beaf8484ada8339b65bd83600f9
          name: 'Edad máxima de la posición GPS'
          type: DEPENDENT
          key: gtfs.data_age_max_s
          value_type: FLOAT
          units: s
          description: 'Ahora menos el timestamp de la posición del vehículo más atrasado.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.data_age_max_s
              error_handler: DISCARD_VALUE
            - type: MATCHES_REGEX
              parameters:
                - '^-?[0-9]+(\.[0-9]+)?$'
              error_handler: DISCARD_VALUE
          master_item:
            key: 'gtfs.probe[{$MACDT.STALE_S}]'
        - uuid: 500b8f925eb94636948e78963ae0f413
          name: 'Edad de la posición GPS por vehículo'
          type: DEPENDENT
          key: gtfs.vehiculos_texto
          value_type: TEXT
          description: 'Ahora menos el timestamp de la posición de cada vehículo, del más atrasado al más fresco. La lista completa va en $.vehiculos del maestro.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.vehiculos_texto
              error_handler: DISCARD_VALUE
          master_item:
            key: 'gtfs.probe[{$MACDT.STALE_S}]'
        - uuid: 2c2952c910714a8e9a4fa685906efaff
          name: 'Tabla de vehículos del feed (HTML)'
          type: DEPENDENT
          key: gtfs.vehiculos_html
          history: 1d
          value_type: TEXT
          description: 'Tabla HTML por vehículo: viaje, última hora reportada, edad, estado y paradas por delante, con el umbral {$MACDT.STALE_S} en el encabezado. Se muestra en el widget Item history en modo HTML.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.vehiculos_html
              error_handler: DISCARD_VALUE
          master_item:
            key: 'gtfs.probe[{$MACDT.STALE_S}]'
        - uuid: 97c60557f17e4d639c6fada7c1a4d675
          name: 'Calendar age'
          type: DEPENDENT
          key: macdt.cal_dias_vigencia
          value_type: FLOAT
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.dias_a_fin_vigencia
              error_handler: DISCARD_VALUE
            - type: MATCHES_REGEX
              parameters:
                - '^-?[0-9]+(\.[0-9]+)?$'
              error_handler: DISCARD_VALUE
          master_item:
            key: macdt.window
          triggers:
            - uuid: 31cb40337b804ba6b4eaad6d21712c88
              expression: 'last(/simovilab-databus/macdt.cal_dias_vigencia)<={$MACDT.CAL.DIAS.WARN}'
              name: 'GTFS estático por vencer'
              priority: HIGH
            - uuid: 0cdff1260afc41f7ae26dc2aa55749b3
              expression: last(/simovilab-databus/macdt.cal_dias_vigencia)<=0
              name: 'GTFS estático vencido'
              priority: DISASTER
        - uuid: 3c718dea9ef54c0da00e46907d67634c
          name: Schedule
          type: DEPENDENT
          key: macdt.gate
          valuemap:
            name: 'Horario operativo'
          description: '1 dentro de L–V 06:20–21:58, 0 fuera. Compuerta de toda la Capa D'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.gate_ventana
              error_handler: DISCARD_VALUE
          master_item:
            key: macdt.window
        - uuid: 4f1c0b9e8d2a4e6f9b3a7c5d1e2f8a60
          name: 'Horario de servicio (texto)'
          type: DEPENDENT
          key: macdt.horario_texto
          value_type: CHAR
          history: 7d
          description: 'Ventana operativa en texto, derivada del GTFS estático. Solo para mostrar en el dashboard.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.horario_texto
              error_handler: DISCARD_VALUE
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          master_item:
            key: macdt.window
        - uuid: 9c2e4a7b1d3f4e8a8b6c0d2e4f6a8b1c
          name: 'Huecos sin buses programados (texto)'
          type: DEPENDENT
          key: macdt.huecos_texto
          value_type: TEXT
          history: 7d
          description: 'Minutos dentro de la ventana con cero viajes programados, en texto. Derivado del GTFS estático. Solo para mostrar en el dashboard.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.huecos_texto
              error_handler: DISCARD_VALUE
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          master_item:
            key: macdt.window    
        - uuid: 7d2d2ed31f2542e3b037c1f9ad5a60e3
          name: 'scheduled slot'
          type: DEPENDENT
          key: macdt.hueco_programado
          description: '1 en los huecos de cero programado. Sirve para suprimir, no para alertar'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.hueco_cero_programado
              error_handler: DISCARD_VALUE
          master_item:
            key: macdt.window
        - uuid: e5af78537d0a418f9d855b8a6215b352
          name: static_zip_age
          type: DEPENDENT
          key: macdt.static_zip_age_s
          value_type: FLOAT
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.static_zip_age_s
              error_handler: DISCARD_VALUE
            - type: MATCHES_REGEX
              parameters:
                - '^-?[0-9]+(\.[0-9]+)?$'
              error_handler: DISCARD_VALUE
          master_item:
            key: macdt.window
        - uuid: 4e9dedd5b10645929bae7342618dc21d
          name: 'SIMOVI: código HTTP del GTFS estático'
          type: DEPENDENT
          key: macdt.static_zip_http
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.static_zip_http
              error_handler: DISCARD_VALUE
          master_item:
            key: macdt.window
          triggers:
            - uuid: f2398441f5414df29633745f863e2f27
              expression: last(/simovilab-databus/macdt.static_zip_http)<>200
              name: 'SIMOVI no sirve el GTFS estático'
              priority: AVERAGE
              description: 'La descarga del gtfs.zip de SIMOVI no devolvió 200 en el primer intento. Sin ese archivo, MACDT no puede derivar la ventana de servicio.'
        - uuid: e046b49d630a4693af8e83d9a98cc03c
          name: 'Scheduled trips'
          type: DEPENDENT
          key: macdt.s_t
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.s_t
              error_handler: DISCARD_VALUE
          master_item:
            key: macdt.window
        - uuid: 29c0d5c86bb940e1b4c928a2c8e7ee7e
          name: 'Max trips'
          type: DEPENDENT
          key: macdt.v_trips_max
          value_type: FLOAT
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.v_trips_max
              error_handler: DISCARD_VALUE
            - type: MATCHES_REGEX
              parameters:
                - '^-?[0-9]+(\.[0-9]+)?$'
              error_handler: DISCARD_VALUE
          master_item:
            key: macdt.window
        - uuid: ed527d5c6882401cadfed2443b97c8e6
          name: macd-Maestro
          type: ZABBIX_ACTIVE
          key: macdt.window
          timeout: 30s
          value_type: TEXT
        - uuid: 6a1219fb00664d89b30772d171da984a
          name: 'Raíz del árbol de la ventana'
          type: DEPENDENT
          key: macdt.window_ok
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.window_ok
              error_handler: DISCARD_VALUE
          master_item:
            key: macdt.window
          triggers:
            - uuid: d70bf1c130d244d6a31acdb1174a567a
              expression: last(/simovilab-databus/macdt.window_ok)=0
              name: 'Capa D: ventana operativa no derivable'
              priority: HIGH
        - uuid: 49e205c62d414a1cb9ff1f465e6031d3
          name: 'Calculo de p'
          type: CALCULATED
          key: p.calculated
          value_type: FLOAT
          params: 'min(last(//gtfs.v_trips) / last(//macdt.v_trips_max), {$MACDT.RHO_CAP})'
      macros:
        - macro: '{$MACDT.CAL.DIAS.WARN}'
          value: '7'
          description: 'Avisar una semana antes de que venza el calendario'
        - macro: '{$MACDT.COMPL.CRIT}'
          value: '80'
          description: '[ESP] 2.5'
        - macro: '{$MACDT.COMPL.WARN}'
          value: '90'
          description: '[ESP] 2.5'
        - macro: '{$MACDT.RHO_CAP}'
          value: '1.2'
          description: 'Tope de ρ'
        - macro: '{$MACDT.STALE_S}'
          value: '60'
          description: 'Segundos para contar como fresca la posición de un vehículo. La recibe la sonda gtfs.probe como --stale. Mantener alineada con TELEMETRY_GRACE_S de databus (60 s).'
        - macro: '{$MACDT.TSFILL.WARN}'
          value: '50'
          description: 'SIMULADO. Calibrar en F6'
        - macro: '{$MACDT.V_AGE.CRIT}'
          value: '70'
          description: 'Justo bajo los 75 s de RUN_FEED_HEALTH_MAX_AGE_SECONDS de infobus'
