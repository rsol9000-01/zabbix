          name: 'Redis: keys'
          type: DEPENDENT
          key: redis.keys
          description: 'Keys stored, summed over every logical database.'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var k = JSON.parse(value).Keyspace || {};
                  var s = 0;
                  for (var db in k) {
                    var o = k[db];
                    s += (typeof o === 'object') ? (Number(o.keys) || 0) : (Number(String(o).replace(/^keys=(\d+).*$/, '$1')) || 0);
                  }
                  return s;
          master_item:
