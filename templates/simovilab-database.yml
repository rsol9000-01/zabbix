        - uuid: 6fea07ee291f492abde6a44af2ee6409
          name: 'Redis: summary table (HTML)'
          type: DEPENDENT
          key: redis.summary_html
          history: 1d
          value_type: TEXT
          description: 'Summary table of Redis for the DATABASE dashboard.'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var r = JSON.parse(value);
                  var S = r.Server || {}, Cl = r.Clients || {}, M = r.Memory || {}, P = r.Persistence || {}, St = r.Stats || {}, R = r.Replication || {}, K = r.Keyspace || {};
                  function n(v) { v = Number(v); return isNaN(v) ? 0 : v; }
                  function mac(s, def) { var v = Number(s); return isNaN(v) ? def : v; }
                  function fmt(v) { return String(Math.round(n(v))).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }
                  function bytes(v) { v = n(v); var u = ['B', 'KB', 'MB', 'GB', 'TB']; var i = 0; while (v >= 1024 && i < 4) { v /= 1024; i++; } return (Math.round(v * 10) / 10) + ' ' + u[i]; }
                  function dur(s) { s = n(s); var d = Math.floor(s / 86400), h = Math.floor((s % 86400) / 3600), m = Math.floor((s % 3600) / 60); return (d ? d + ' d ' : '') + h + ' h ' + m + ' min'; }
                  var C = { OK: '#43A047', WARN: '#FB8C00', ERROR: '#E53935', INFO: '#1E88E5' };
                  function st(s) { return s ? '<span style="color:#fff;background:' + C[s] + ';padding:1px 6px;border-radius:3px;font-weight:bold">' + s + '</span>' : ''; }
                  var th = 'style="text-align:left;padding:4px 10px;border-bottom:2px solid #8888;white-space:nowrap"';
                  var td = 'style="padding:4px 10px;border-bottom:1px solid #8884;white-space:nowrap"';
                  var tdn = 'style="padding:4px 10px;border-bottom:1px solid #8884;white-space:nowrap;text-align:right;font-weight:bold"';
                  var tdd = 'style="padding:4px 10px;border-bottom:1px solid #8884;white-space:normal;opacity:.85"';
                  var cw = mac('{$REDIS.CLIENTS.WARN}', 200), cc = mac('{$REDIS.CLIENTS.CRIT}', 400);
                  var mw = mac('{$REDIS.MEM.PCT.WARN}', 75), mc = mac('{$REDIS.MEM.PCT.CRIT}', 90);
                  var cli = n(Cl.connected_clients), used = n(M.used_memory), mx = n(M.maxmemory);
                  var pct = mx > 0 ? Math.round(used * 1000 / mx) / 10 : null;
                  var keys = 0, dbs = [];
                  for (var db in K) { var o = K[db]; var k = (typeof o === 'object') ? n(o.keys) : n(String(o).replace(/^keys=(\d+).*$/, '$1')); keys += k; dbs.push(db + ': ' + fmt(k)); }
                  var now = Math.floor(Date.now() / 1000);
                  var saveOk = String(P.rdb_last_bgsave_status) === 'ok';
                  var aofOn = n(P.aof_enabled) === 1;
                  var aofOk = String(P.aof_last_write_status) === 'ok';
                  var ev = n(St.evicted_keys);
                  var rows = [
                    ['Version and role', (S.redis_version || '-') + ' · ' + (R.role || '-'), '', 'Redis version and replication role', ''],
                    ['Uptime', dur(S.uptime_in_seconds), '', 'Time since the last start', ''],
                    ['Connected clients', fmt(cli), cli > cc ? 'ERROR' : (cli > cw ? 'WARN' : 'OK'), 'Application, workers and WebSocket channels', '> ' + cw + ' warning, > ' + cc + ' critical (5 min)'],
                    ['Blocked clients', fmt(Cl.blocked_clients), '', 'Waiting on a blocking command', ''],
                    ['Memory used', bytes(used) + ' (peak ' + bytes(M.used_memory_peak) + ')', '', 'Memory taken by the stored data', ''],
                    ['Memory limit', mx > 0 ? bytes(mx) : 'no limit', mx > 0 ? 'OK' : 'INFO', 'maxmemory. Without it, usage alerts cannot fire', 'INFO when not set'],
                    ['Memory usage', pct === null ? '-' : pct + ' %', pct === null ? '' : (pct > mc ? 'ERROR' : (pct > mw ? 'WARN' : 'OK')), 'Used against the limit', '> ' + mw + ' % warning, > ' + mc + ' % critical (5 min)'],
                    ['Eviction policy', M.maxmemory_policy || '-', '', 'What Redis deletes when full. For live state, noeviction is the safe choice', ''],
                    ['Keys', fmt(keys), '', dbs.length ? dbs.join(' · ') : 'empty', ''],
                    ['Operations per second', fmt(St.instantaneous_ops_per_sec), '', 'Commands processed per second', ''],
                    ['Evicted keys (total)', fmt(ev), ev > 0 ? 'ERROR' : 'OK', 'Keys deleted because memory was full: lost state', 'Any eviction in 15 min'],
                    ['Expired keys (total)', fmt(St.expired_keys), '', 'Keys removed by their TTL (normal)', ''],
                    ['Last snapshot (RDB)', (P.rdb_last_bgsave_status || '-') + ' · ' + dur(now - n(P.rdb_last_save_time)) + ' ago · ' + fmt(P.rdb_changes_since_last_save) + ' changes pending', saveOk ? 'OK' : 'ERROR', 'Copy of the data on disk', 'Last save failed'],
                    ['Append-only file (AOF)', aofOn ? ('on · last write ' + (P.aof_last_write_status || '-')) : 'off', aofOn ? (aofOk ? 'OK' : 'ERROR') : '', 'Write log on disk, if enabled', aofOn ? 'Last write failed' : '']
                  ];
                  var h = '<div style="font-size:calc(1em + 4px)"><br><div style="font-weight:bold;font-size:1.1em;color:#4169E1;text-decoration:underline">REDIS (STATE)</div><br>';
                  h += '<table style="border-collapse:collapse"><tr><th ' + th + '>Measurement</th><th ' + th + '>Value</th><th ' + th + '>Status</th><th ' + th + '>What it means</th><th ' + th + '>Error when</th></tr>';
                  for (var i = 0; i < rows.length; i++) {
                    h += '<tr><td ' + td + '>' + rows[i][0] + '</td><td ' + tdn + '>' + rows[i][1] + '</td><td ' + td + '>' + st(rows[i][2]) + '</td><td ' + tdd + '>' + rows[i][3] + '</td><td ' + tdd + '>' + rows[i][4] + '</td></tr>';
                  }
                  h += '</table><div style="opacity:.7;font-size:.75em;margin-top:4px">Redis holds live state in databus and infobus, not cache: hit ratio is not measured and any eviction is an error.</div></div>';
                  return h;
          master_item:
            key: 'redis.info["{$DB.SESSION}"]'
          tags:
            - tag: component
              value: redis
