                - name: 'Redis: memory usage critical'
                  expression: 'min(/simovilab-database/redis.mem.pct,5m)>{$REDIS.MEM.PCT.CRIT}'
              tags:
                - tag: layer
                  value: database
            - uuid: 1654acaa2f694cedae29d99fc8148370
              expression: 'min(/simovilab-database/redis.mem.pct,5m)>{$REDIS.MEM.PCT.CRIT}'
              name: 'Redis: memory usage critical'
