        - uuid: 248f433f2f8746d5aee0c523643c05e6
          name: 'PostgreSQL: dead tuples by table (HTML)'
          type: DEPENDENT
          key: pgsql.db.tables_html
          history: 1d
          value_type: TEXT
          description: 'Top 10 tables by dead rows, for the DATABASE dashboard.'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var r = JSON.parse(value);
                  if (!Array.isArray(r)) { r = r.rows || []; }
                  function n(v) { v = Number(v); return isNaN(v) ? 0 : v; }
                  function fmt(v) { return String(Math.round(n(v))).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }
                  function bytes(v) { v = n(v); var u = ['B', 'KB', 'MB', 'GB', 'TB']; var i = 0; while (v >= 1024 && i < 4) { v /= 1024; i++; } return (Math.round(v * 10) / 10) + ' ' + u[i]; }
                  function age(s) { s = n(s); if (s < 0) { return 'never'; } if (s < 3600) { return Math.round(s / 60) + ' min ago'; } if (s < 172800) { return Math.round(s / 3600) + ' h ago'; } return Math.round(s / 86400) + ' days ago'; }
                  var C = { OK: '#43A047', WARN: '#FB8C00' };
                  function st(s, label) { return '<span style="color:#fff;background:' + C[s] + ';padding:1px 6px;border-radius:3px;font-weight:bold">' + label + '</span>'; }
                  var th = 'style="text-align:left;padding:4px 10px;border-bottom:2px solid #8888;white-space:nowrap"';
                  var td = 'style="padding:4px 10px;border-bottom:1px solid #8884;white-space:nowrap"';
                  var tdn = 'style="padding:4px 10px;border-bottom:1px solid #8884;white-space:nowrap;text-align:right;font-weight:bold"';
                  var total = 0, due = 0;
                  for (var i = 0; i < r.length; i++) { total += n(r[i].dead); if (n(r[i].dead) > 50 + 0.2 * n(r[i].live)) { due++; } }
                  var h = '<div style="font-size:calc(1em + 4px)"><br><div style="font-weight:bold;font-size:1.1em;color:#4169E1;text-decoration:underline">DEAD TUPLES BY TABLE (TOP 10)</div><br>';
                  h += '<table style="border-collapse:collapse"><tr><th ' + th + '>Table</th><th ' + th + '>Live rows</th><th ' + th + '>Dead rows</th><th ' + th + '>Dead %</th><th ' + th + '>Last vacuum</th><th ' + th + '>Size</th><th ' + th + '>Status</th></tr>';
                  for (var j = 0; j < r.length && j < 10; j++) {
                    var lv = n(r[j].live), dd = n(r[j].dead);
                    var pct = (lv + dd) > 0 ? Math.round(dd * 1000 / (lv + dd)) / 10 : 0;
                    var s = dd > 50 + 0.2 * lv ? st('WARN', 'VACUUM DUE') : st('OK', 'OK');
                    h += '<tr><td ' + td + '>' + r[j].tbl + '</td><td ' + tdn + '>' + fmt(lv) + '</td><td ' + tdn + '>' + fmt(dd) + '</td><td ' + tdn + '>' + pct + ' %</td><td ' + td + '>' + age(r[j].vacuum_age_s) + '</td><td ' + tdn + '>' + bytes(r[j].size_b) + '</td><td ' + td + '>' + s + '</td></tr>';
                  }
                  h += '</table><div style="opacity:.7;font-size:.75em;margin-top:4px">' + r.length + ' tables · ' + fmt(total) + ' dead rows in total · ' + due + ' waiting for vacuum. VACUUM DUE = dead rows above the autovacuum threshold of PostgreSQL (50 + 20 % of live rows).</div></div>';
                  return h;
          master_item:
            key: 'pgsql.custom.query["{$DB.SESSION}",,,,simovilab_tables]'
          tags:
            - tag: component
              value: postgresql
        # ───────────────────────── REDIS ─────────────────────────
        - uuid: 0556b75475a847bcad9ac25cbc1a3ea0
          name: 'Redis: availability (ping)'
          type: ZABBIX_ACTIVE
          key: 'redis.ping["{$DB.SESSION}"]'
          delay: 1m
          description: 'Sends PING with the Redis password. 1 = Redis answers, 0 = it does not (stopped, unreachable or wrong password).'
          valuemap:
            name: 'Service state'
