zabbix_export:
  version: '7.4'
  template_groups:
    - uuid: 19a51f2ca0864028ba21eb9633248ac3
      name: Templates/Simovilab
  templates:
    - uuid: 1fb735b4dade4e96b925f368576d5fa0
      template: simovilab-database
      name: simovilab-database
      description: |
        Database layer of databus and infobus: PostgreSQL (service "database") and Redis (service "state").
        One template for both projects. The only difference is the macro {$DB.SESSION}, which is at the same
        time the Agent 2 session name in simovilab-plugins.conf and the PostgreSQL database name. It is NOT
        defined here: it comes from the role template linked to the same host (simovilab-databus = databus,
        simovilab-infobus = infobus), so autoregistration needs no manual host macro.
        PostgreSQL is read with the read-only role zabbix_ro (pg_monitor). Redis is read with its password.
        Dead tuples per table need the custom query agent2/pgsql-queries/simovilab_tables.sql.
        Thresholds come from the specification document, section 2.2 and 2.3. Redis in both projects stores
        authoritative state (runs, positions, WebSocket subscriptions), not cache: hit ratio is not measured
        and any evicted key is treated as lost data.
      groups:
        - name: Templates/Simovilab
      items:
        # ───────────────────────── POSTGRESQL ─────────────────────────
        - uuid: cf2ee40b5ee34bad98278c168e3bef82
          name: 'PostgreSQL: availability (ping)'
          type: ZABBIX_ACTIVE
          key: 'pgsql.ping["{$DB.SESSION}"]'
          delay: 1m
          description: 'Opens a connection with zabbix_ro and runs a test query. 1 = the database answers, 0 = it does not (stopped, unreachable or wrong credentials).'
          valuemap:
            name: 'Service state'
          tags:
            - tag: component
              value: postgresql
          triggers:
            - uuid: c54134d1ceb44f28aaa2eab4f55318da
              expression: 'max(/simovilab-database/pgsql.ping["{$DB.SESSION}"],#2)=0'
              recovery_mode: RECOVERY_EXPRESSION
              recovery_expression: 'last(/simovilab-database/pgsql.ping["{$DB.SESSION}"])=1'
              name: 'PostgreSQL DOWN: database not reachable'
              priority: HIGH
              description: |
                Measures: test connection to PostgreSQL every minute with the zabbix_ro role.
                ERROR: two checks in a row without answer. The application cannot read or write data.
                Check: container "database" is running, the agent is on the project network, zabbix_ro password in simovilab-plugins.conf.
                Root of the PostgreSQL tree: while it is open, the other PostgreSQL alerts stay suppressed.
              dependencies:
                - name: 'Server DOWN!!!'
                  expression: 'max(/simovilab servidor y sistema operativo/icmpping[,3],#3)=0'
                  recovery_expression: 'last(/simovilab servidor y sistema operativo/icmpping[,3])=1'
              tags:
                - tag: layer
                  value: database
        - uuid: d466527c3053450db7645aaebb16f37c
          name: 'PostgreSQL: connections (raw)'
          type: ZABBIX_ACTIVE
          key: 'pgsql.connections["{$DB.SESSION}"]'
          delay: 1m
          history: 1h
          value_type: TEXT
          description: 'Master item. Connections of the whole PostgreSQL server grouped by state (pg_stat_activity).'
          tags:
            - tag: component
              value: postgresql
        - uuid: b06b9ea4172540b099c25b8a8d7c5a80
          name: 'PostgreSQL: active connections'
          type: DEPENDENT
          key: pgsql.conn.active
          description: 'Connections running a query right now.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.active
              error_handler: DISCARD_VALUE
          master_item:
            key: 'pgsql.connections["{$DB.SESSION}"]'
          tags:
            - tag: component
              value: postgresql
          triggers:
            - uuid: 9640d1117de24339b93135668798af64
              expression: 'min(/simovilab-database/pgsql.conn.active,5m)>{$PG.CONN.ACTIVE.WARN}'
              name: 'PostgreSQL: too many active connections'
              event_name: 'PostgreSQL: too many active connections (over {$PG.CONN.ACTIVE.WARN} for 5 min)'
              opdata: 'Active: {ITEM.LASTVALUE1}'
              priority: WARNING
              description: |
                Measures: connections executing a query at the same time.
                ERROR: more than {$PG.CONN.ACTIVE.WARN} during 5 minutes. Queries are piling up: slow queries, locks or a burst of workers.
                Check: longest running query, connections waiting on a lock.
              dependencies:
                - name: 'PostgreSQL DOWN: database not reachable'
                  expression: 'max(/simovilab-database/pgsql.ping["{$DB.SESSION}"],#2)=0'
                  recovery_expression: 'last(/simovilab-database/pgsql.ping["{$DB.SESSION}"])=1'
                - name: 'PostgreSQL: active connections critical'
                  expression: 'min(/simovilab-database/pgsql.conn.active,5m)>{$PG.CONN.ACTIVE.CRIT}'
              tags:
                - tag: layer
                  value: database
            - uuid: 867f10f5f0034d3789728d6c90e0d03e
              expression: 'min(/simovilab-database/pgsql.conn.active,5m)>{$PG.CONN.ACTIVE.CRIT}'
              name: 'PostgreSQL: active connections critical'
              event_name: 'PostgreSQL: active connections critical (over {$PG.CONN.ACTIVE.CRIT} for 5 min)'
              opdata: 'Active: {ITEM.LASTVALUE1}'
              priority: HIGH
              description: |
                Measures: connections executing a query at the same time.
                ERROR: more than {$PG.CONN.ACTIVE.CRIT} during 5 minutes. The database is saturated and the API will start to time out.
              dependencies:
                - name: 'PostgreSQL DOWN: database not reachable'
                  expression: 'max(/simovilab-database/pgsql.ping["{$DB.SESSION}"],#2)=0'
                  recovery_expression: 'last(/simovilab-database/pgsql.ping["{$DB.SESSION}"])=1'
              tags:
                - tag: layer
                  value: database
        - uuid: db0cf792e845410fb9a3d7ef76b88ab7
          name: 'PostgreSQL: idle connections'
          type: DEPENDENT
          key: pgsql.conn.idle
          description: 'Open connections doing nothing (normal in a connection pool).'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.idle
              error_handler: DISCARD_VALUE
          master_item:
            key: 'pgsql.connections["{$DB.SESSION}"]'
          tags:
            - tag: component
              value: postgresql
        - uuid: 1b39d1d3623e45c3a284eeb932f07257
          name: 'PostgreSQL: idle in transaction connections'
          type: DEPENDENT
          key: pgsql.conn.idle_in_tx
          description: 'Connections that opened a transaction and are not doing anything. They hold locks and block vacuum.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.idle_in_transaction
              error_handler: DISCARD_VALUE
          master_item:
            key: 'pgsql.connections["{$DB.SESSION}"]'
          tags:
            - tag: component
              value: postgresql
          triggers:
            - uuid: a7178bab5dd24bfa887a5b3b5cb61e18
              expression: 'min(/simovilab-database/pgsql.conn.idle_in_tx,5m)>{$PG.CONN.IDLETX.WARN}'
              name: 'PostgreSQL: connections stuck in a transaction'
              event_name: 'PostgreSQL: connections stuck in a transaction (over {$PG.CONN.IDLETX.WARN} for 5 min)'
              opdata: 'Idle in transaction: {ITEM.LASTVALUE1}'
              priority: WARNING
              description: |
                Measures: connections with an open transaction that are not running anything.
                ERROR: more than {$PG.CONN.IDLETX.WARN} during 5 minutes. Usually application code that does not commit; they hold locks and prevent vacuum.
                Check: longest open transaction.
              dependencies:
                - name: 'PostgreSQL DOWN: database not reachable'
                  expression: 'max(/simovilab-database/pgsql.ping["{$DB.SESSION}"],#2)=0'
                  recovery_expression: 'last(/simovilab-database/pgsql.ping["{$DB.SESSION}"])=1'
                - name: 'PostgreSQL: connections stuck in a transaction critical'
                  expression: 'min(/simovilab-database/pgsql.conn.idle_in_tx,5m)>{$PG.CONN.IDLETX.CRIT}'
              tags:
                - tag: layer
                  value: database
            - uuid: 733abfcb3c1d42e5aaea8e88f58e58d3
              expression: 'min(/simovilab-database/pgsql.conn.idle_in_tx,5m)>{$PG.CONN.IDLETX.CRIT}'
              name: 'PostgreSQL: connections stuck in a transaction critical'
              event_name: 'PostgreSQL: connections stuck in a transaction critical (over {$PG.CONN.IDLETX.CRIT} for 5 min)'
              opdata: 'Idle in transaction: {ITEM.LASTVALUE1}'
              priority: HIGH
              description: |
                Measures: connections with an open transaction that are not running anything.
                ERROR: more than {$PG.CONN.IDLETX.CRIT} during 5 minutes. Locks and table bloat grow until the application blocks.
              dependencies:
                - name: 'PostgreSQL DOWN: database not reachable'
                  expression: 'max(/simovilab-database/pgsql.ping["{$DB.SESSION}"],#2)=0'
                  recovery_expression: 'last(/simovilab-database/pgsql.ping["{$DB.SESSION}"])=1'
              tags:
                - tag: layer
                  value: database
        - uuid: 4be98bfb4f44455180b7e8eb3b4883cb
          name: 'PostgreSQL: connections waiting on a lock'
          type: DEPENDENT
          key: pgsql.conn.waiting
          description: 'Connections blocked waiting for a lock held by another one.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.waiting
              error_handler: DISCARD_VALUE
          master_item:
            key: 'pgsql.connections["{$DB.SESSION}"]'
          tags:
            - tag: component
              value: postgresql
        - uuid: d6ebba5656ae41e6a90a18bdea793752
          name: 'PostgreSQL: total connections'
          type: DEPENDENT
          key: pgsql.conn.total
          description: 'All connections of the server, in any state.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.total
              error_handler: DISCARD_VALUE
          master_item:
            key: 'pgsql.connections["{$DB.SESSION}"]'
          tags:
            - tag: component
              value: postgresql
        - uuid: 3c87aa0ec5d8481e86db9575ec15d3b8
          name: 'PostgreSQL: connections used of max_connections'
          type: DEPENDENT
          key: pgsql.conn.total_pct
          value_type: FLOAT
          units: '%'
          description: 'Total connections as a percentage of max_connections. At 100 % new connections are rejected.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.total_pct
              error_handler: DISCARD_VALUE
          master_item:
            key: 'pgsql.connections["{$DB.SESSION}"]'
          tags:
            - tag: component
              value: postgresql
          triggers:
            - uuid: 045de022927740e89620bdf16d30be97
              expression: 'min(/simovilab-database/pgsql.conn.total_pct,5m)>{$PG.CONN.PCT.CRIT}'
              name: 'PostgreSQL: connections close to max_connections'
              event_name: 'PostgreSQL: connections close to max_connections (over {$PG.CONN.PCT.CRIT} % for 5 min)'
              opdata: 'Used: {ITEM.LASTVALUE1}'
              priority: HIGH
              description: |
                Measures: open connections against the server limit (max_connections).
                ERROR: above {$PG.CONN.PCT.CRIT} % for 5 minutes. When it reaches 100 %, PostgreSQL rejects every new connection (API and workers fail).
              dependencies:
                - name: 'PostgreSQL DOWN: database not reachable'
                  expression: 'max(/simovilab-database/pgsql.ping["{$DB.SESSION}"],#2)=0'
                  recovery_expression: 'last(/simovilab-database/pgsql.ping["{$DB.SESSION}"])=1'
              tags:
                - tag: layer
                  value: database
        - uuid: 0cfa5cb419914351ae0c2318bdf0e932
          name: 'PostgreSQL: database statistics (raw, all databases)'
          type: ZABBIX_ACTIVE
          key: 'pgsql.dbstat["{$DB.SESSION}"]'
          delay: 1m
          history: 1h
          value_type: TEXT
          description: 'Master item. pg_stat_database for every database of the server, keyed by name.'
          tags:
            - tag: component
              value: postgresql
        - uuid: 0d481943299b4c34aed2caa91ff5c2f1
          name: 'PostgreSQL: database statistics (raw, this database)'
          type: DEPENDENT
          key: pgsql.db.stat
          history: '0'
          value_type: TEXT
          description: 'Only the row of the project database ({$DB.SESSION}). Counters since the last statistics reset.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$[''{$DB.SESSION}'']'
              error_handler: DISCARD_VALUE
          master_item:
            key: 'pgsql.dbstat["{$DB.SESSION}"]'
          tags:
            - tag: component
              value: postgresql
        - uuid: 9a931fb79a4d4e54a30b9404f36c61b8
          name: 'PostgreSQL: commits per second'
          type: DEPENDENT
          key: pgsql.db.commits.rate
          value_type: FLOAT
          units: tps
          description: 'Transactions confirmed per second in the project database.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.xact_commit
            - type: CHANGE_PER_SECOND
              parameters:
                - ''
              error_handler: DISCARD_VALUE
          master_item:
            key: pgsql.db.stat
          tags:
            - tag: component
              value: postgresql
        - uuid: 5e9778133098467c980cddd2f7378f5a
          name: 'PostgreSQL: rollbacks per second'
          type: DEPENDENT
          key: pgsql.db.rollbacks.rate
          value_type: FLOAT
          units: tps
          description: 'Transactions undone per second (by the application or by an error).'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.xact_rollback
            - type: CHANGE_PER_SECOND
              parameters:
                - ''
              error_handler: DISCARD_VALUE
          master_item:
            key: pgsql.db.stat
          tags:
            - tag: component
              value: postgresql
        - uuid: fbb4591042a34489a2bd7936aa91ac40
          name: 'PostgreSQL: blocks read from cache per second'
          type: DEPENDENT
          key: pgsql.db.blks_hit.rate
          value_type: FLOAT
          description: 'Data blocks found in shared_buffers. Input of the cache hit ratio.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.blks_hit
            - type: CHANGE_PER_SECOND
              parameters:
                - ''
              error_handler: DISCARD_VALUE
          master_item:
            key: pgsql.db.stat
          tags:
            - tag: component
              value: postgresql
        - uuid: 5b0fdbc5b2674d888d52fea3fd12ec0c
          name: 'PostgreSQL: blocks read from disk per second'
          type: DEPENDENT
          key: pgsql.db.blks_read.rate
          value_type: FLOAT
          description: 'Data blocks that had to be read from disk. Input of the cache hit ratio.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.blks_read
            - type: CHANGE_PER_SECOND
              parameters:
                - ''
              error_handler: DISCARD_VALUE
          master_item:
            key: pgsql.db.stat
          tags:
            - tag: component
              value: postgresql
        - uuid: 70779de2be3e41f793c23c777bc50fc3
          name: 'PostgreSQL: cache hit ratio'
          type: CALCULATED
          key: pgsql.db.cache_hit
          delay: 1m
          value_type: FLOAT
          units: '%'
          params: '(last(//pgsql.db.blks_hit.rate)+last(//pgsql.db.blks_read.rate)=0)*100+(last(//pgsql.db.blks_hit.rate)+last(//pgsql.db.blks_read.rate)>0)*last(//pgsql.db.blks_hit.rate)*100/(last(//pgsql.db.blks_hit.rate)+last(//pgsql.db.blks_read.rate)+(last(//pgsql.db.blks_hit.rate)+last(//pgsql.db.blks_read.rate)=0))'
          description: 'Share of block reads served from memory during the last minute. 100 % when there were no reads.'
          tags:
            - tag: component
              value: postgresql
          triggers:
            - uuid: 7ff4f24285d64a8bbb8df612f08b030c
              expression: 'avg(/simovilab-database/pgsql.db.cache_hit,15m)<{$PG.CACHE.HIT.WARN}'
              name: 'PostgreSQL: low cache hit ratio'
              event_name: 'PostgreSQL: low cache hit ratio (under {$PG.CACHE.HIT.WARN} % in 15 min)'
              opdata: 'Cache hit: {ITEM.LASTVALUE1}'
              priority: WARNING
              description: |
                Measures: share of data blocks read from memory instead of disk (15-minute average).
                ERROR: under {$PG.CACHE.HIT.WARN} %. Queries go to disk: shared_buffers too small for the data or full scans without index.
              dependencies:
                - name: 'PostgreSQL DOWN: database not reachable'
                  expression: 'max(/simovilab-database/pgsql.ping["{$DB.SESSION}"],#2)=0'
                  recovery_expression: 'last(/simovilab-database/pgsql.ping["{$DB.SESSION}"])=1'
                - name: 'PostgreSQL: cache hit ratio critical'
                  expression: 'avg(/simovilab-database/pgsql.db.cache_hit,15m)<{$PG.CACHE.HIT.CRIT}'
              tags:
                - tag: layer
                  value: database
            - uuid: 75d846390618491a9531a7a58b60f215
              expression: 'avg(/simovilab-database/pgsql.db.cache_hit,15m)<{$PG.CACHE.HIT.CRIT}'
              name: 'PostgreSQL: cache hit ratio critical'
              event_name: 'PostgreSQL: cache hit ratio critical (under {$PG.CACHE.HIT.CRIT} % in 15 min)'
              opdata: 'Cache hit: {ITEM.LASTVALUE1}'
              priority: HIGH
              description: |
                Measures: share of data blocks read from memory instead of disk (15-minute average).
                ERROR: under {$PG.CACHE.HIT.CRIT} %. Most reads hit the disk and response times degrade.
              dependencies:
                - name: 'PostgreSQL DOWN: database not reachable'
                  expression: 'max(/simovilab-database/pgsql.ping["{$DB.SESSION}"],#2)=0'
                  recovery_expression: 'last(/simovilab-database/pgsql.ping["{$DB.SESSION}"])=1'
              tags:
                - tag: layer
                  value: database
        - uuid: bc44a5decfd7468e9b39b703edb36d12
          name: 'PostgreSQL: new deadlocks'
          type: DEPENDENT
          key: pgsql.db.deadlocks
          description: 'Deadlocks detected since the previous check (1 min).'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.deadlocks
            - type: SIMPLE_CHANGE
              parameters:
                - ''
              error_handler: DISCARD_VALUE
          master_item:
            key: pgsql.db.stat
          tags:
            - tag: component
              value: postgresql
          triggers:
            - uuid: 3f50805205d142bd920b8186a21ca078
              expression: 'sum(/simovilab-database/pgsql.db.deadlocks,15m)>0'
              name: 'PostgreSQL: deadlock detected'
              event_name: 'PostgreSQL: deadlock detected ({ITEM.LASTVALUE1} in the last check)'
              priority: AVERAGE
              description: |
                Measures: deadlocks in the project database.
                ERROR: any deadlock in the last 15 minutes. Two transactions blocked each other and PostgreSQL cancelled one: an operation of the application failed.
                Closes by itself after 15 minutes without new deadlocks. Check the PostgreSQL log for the statements involved.
              dependencies:
                - name: 'PostgreSQL DOWN: database not reachable'
                  expression: 'max(/simovilab-database/pgsql.ping["{$DB.SESSION}"],#2)=0'
                  recovery_expression: 'last(/simovilab-database/pgsql.ping["{$DB.SESSION}"])=1'
              tags:
                - tag: layer
                  value: database
        - uuid: 9738d6133aca409fb2bc2e6a41521029
          name: 'PostgreSQL: summary table (HTML)'
          type: DEPENDENT
          key: pgsql.db.summary_html
          history: 1d
          value_type: TEXT
          description: 'Summary table of the project database for the DATABASE dashboard.'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var d = JSON.parse(value);
                  function n(v) { v = Number(v); return isNaN(v) ? 0 : v; }
                  function mac(s, def) { var v = Number(s); return isNaN(v) ? def : v; }
                  function fmt(v) { return String(Math.round(n(v))).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }
                  function bytes(v) { v = n(v); var u = ['B', 'KB', 'MB', 'GB', 'TB']; var i = 0; while (v >= 1024 && i < 4) { v /= 1024; i++; } return (Math.round(v * 10) / 10) + ' ' + u[i]; }
                  var C = { OK: '#43A047', WARN: '#FB8C00', ERROR: '#E53935', INFO: '#1E88E5' };
                  function st(s) { return s ? '<span style="color:#fff;background:' + C[s] + ';padding:1px 6px;border-radius:3px;font-weight:bold">' + s + '</span>' : ''; }
                  var th = 'style="text-align:left;padding:4px 10px;border-bottom:2px solid #8888;white-space:nowrap"';
                  var td = 'style="padding:4px 10px;border-bottom:1px solid #8884;white-space:nowrap"';
                  var tdn = 'style="padding:4px 10px;border-bottom:1px solid #8884;white-space:nowrap;text-align:right;font-weight:bold"';
                  var tdd = 'style="padding:4px 10px;border-bottom:1px solid #8884;white-space:normal;opacity:.85"';
                  var hit = n(d.blks_hit), rd = n(d.blks_read);
                  var hitPct = (hit + rd) > 0 ? Math.round(hit * 1000 / (hit + rd)) / 10 : 100;
                  var hw = mac('{$PG.CACHE.HIT.WARN}', 95), hc = mac('{$PG.CACHE.HIT.CRIT}', 90);
                  var com = n(d.xact_commit), rb = n(d.xact_rollback);
                  var rbPct = (com + rb) > 0 ? Math.round(rb * 1000 / (com + rb)) / 10 : 0;
                  var rows = [
                    ['Backends connected', fmt(d.numbackends), '', 'Connections open to this database right now', 'See connections gauge'],
                    ['Cache hit ratio', hitPct + ' %', hitPct < hc ? 'ERROR' : (hitPct < hw ? 'WARN' : 'OK'), 'Block reads served from memory. Low means queries read from disk', '< ' + hw + ' % warning, < ' + hc + ' % critical (15 min average)'],
                    ['Transactions committed', fmt(com), '', 'Confirmed transactions', ''],
                    ['Transactions rolled back', fmt(rb) + ' (' + rbPct + ' %)', '', 'Undone by the application or by an error', ''],
                    ['Deadlocks', fmt(d.deadlocks), n(d.deadlocks) > 0 ? 'INFO' : 'OK', 'Two transactions blocked each other; PostgreSQL cancelled one', 'Any new deadlock in 15 min'],
                    ['Rows read', fmt(d.tup_fetched), '', 'Rows fetched by queries', ''],
                    ['Rows written', fmt(n(d.tup_inserted) + n(d.tup_updated) + n(d.tup_deleted)), '', 'Inserted ' + fmt(d.tup_inserted) + ' · updated ' + fmt(d.tup_updated) + ' · deleted ' + fmt(d.tup_deleted), ''],
                    ['Temporary files', fmt(d.temp_files) + ' (' + bytes(d.temp_bytes) + ')', '', 'Queries that did not fit in work_mem and spilled to disk', '']
                  ];
                  if (d.checksum_failures !== undefined && d.checksum_failures !== null) {
                    rows.push(['Checksum failures', fmt(d.checksum_failures), n(d.checksum_failures) > 0 ? 'ERROR' : 'OK', 'Damaged data pages detected on read', 'Any failure: data corruption']);
                  }
                  var h = '<div style="font-size:calc(1em + 4px)"><br><div style="font-weight:bold;font-size:1.1em;color:#4169E1;text-decoration:underline">POSTGRESQL</div><br>';
                  h += '<table style="border-collapse:collapse"><tr><th ' + th + '>Measurement</th><th ' + th + '>Value</th><th ' + th + '>Status</th><th ' + th + '>What it means</th><th ' + th + '>Error when</th></tr>';
                  for (var i = 0; i < rows.length; i++) {
                    h += '<tr><td ' + td + '>' + rows[i][0] + '</td><td ' + tdn + '>' + rows[i][1] + '</td><td ' + td + '>' + st(rows[i][2]) + '</td><td ' + tdd + '>' + rows[i][3] + '</td><td ' + tdd + '>' + rows[i][4] + '</td></tr>';
                  }
                  h += '</table><div style="opacity:.7;font-size:.75em;margin-top:4px">Counters since the last statistics reset. Alerts use the per-minute rates.</div></div>';
                  return h;
          master_item:
            key: pgsql.db.stat
          tags:
            - tag: component
              value: postgresql
        - uuid: dcd03e0a7a414641b238654a0776e11f
          name: 'PostgreSQL: running queries (raw, all databases)'
          type: ZABBIX_ACTIVE
          key: 'pgsql.queries["{$DB.SESSION}",,,,"{$PG.SLOW.QUERY.S}"]'
          delay: 1m
          history: 1h
          value_type: TEXT
          description: 'Master item. Duration of the queries and transactions running now, per database. A query counts as slow above {$PG.SLOW.QUERY.S} s.'
          tags:
            - tag: component
              value: postgresql
        - uuid: 40b634300ac24e88ba8f09bbced2e5aa
