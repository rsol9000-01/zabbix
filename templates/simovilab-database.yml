              name: 'Redis DOWN: state store not reachable'
              priority: HIGH
              description: |
                Measures: PING to Redis every minute.
                ERROR: two checks in a row without answer. The project loses its live state (runs in progress, positions, WebSocket channels).
                Check: container "state" is running, the agent is on the project network, Redis password in simovilab-plugins.conf.
                Root of the Redis tree: while it is open, the other Redis alerts stay suppressed.
              dependencies:
                - name: 'Server DOWN!!!'
                  expression: 'max(/simovilab servidor y sistema operativo/icmpping[,3],#3)=0'
                  recovery_expression: 'last(/simovilab servidor y sistema operativo/icmpping[,3])=1'
              tags:
