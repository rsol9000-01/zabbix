    <path class="edge" d="M95 64 V92" marker-end="url(#b)"/>
    <path class="edge" d="M265 64 V92" marker-end="url(#b)"/>

    <text class="m cap" x="20" y="166" font-size="11" letter-spacing="1.4">BORDE</text>
    <rect x="20" y="176" width="156" height="52" rx="6" fill="#ffffff" stroke="#0b6e99" stroke-width="1.6"/>
    <text class="m" x="98" y="198" font-size="12.5" font-weight="600" text-anchor="middle">telemetry-broker</text>
    <text class="m cap" x="98" y="215" font-size="10.5" text-anchor="middle">NanoMQ 0.24.9</text>
    <rect x="192" y="176" width="156" height="52" rx="6" fill="#ffffff" stroke="#0b6e99" stroke-width="2.2"/>
    <text class="m" x="270" y="198" font-size="12.5" font-weight="600" text-anchor="middle">orchestrator</text>
    <text class="m cap" x="270" y="215" font-size="10.5" text-anchor="middle">Django/Daphne :8000</text>
    <rect x="364" y="176" width="150" height="52" rx="6" fill="#ffffff" stroke="#0b6e99" stroke-width="1.6"/>
    <text class="m" x="439" y="198" font-size="12.5" font-weight="600" text-anchor="middle">user-interface</text>
    <text class="m cap" x="439" y="215" font-size="10.5" text-anchor="middle">Nuxt</text>
    <rect x="530" y="176" width="110" height="52" rx="6" fill="#ffffff" stroke="#0b6e99" stroke-width="1.6"/>
    <text class="m" x="585" y="198" font-size="12.5" font-weight="600" text-anchor="middle">docs</text>
    <text class="m cap" x="585" y="215" font-size="10.5" text-anchor="middle">nginx</text>
    <rect x="656" y="176" width="166" height="52" rx="6" fill="#ffffff" stroke="#0b6e99" stroke-width="1.6"/>
    <text class="m" x="739" y="198" font-size="12.5" font-weight="600" text-anchor="middle">analytics-engine</text>
    <text class="m cap" x="739" y="215" font-size="10.5" text-anchor="middle">Prefect 3</text>
    <rect x="838" y="176" width="182" height="52" rx="6" fill="#ffffff" stroke="#0b6e99" stroke-width="1.6"/>
