<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 830" width="1200" height="830" role="img" aria-label="Servicios internos de databus con sus agentes">
<title>Nivel 2A — R3 · databus</title>
<style>
text{font-family:'IBM Plex Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#17202a}
text.m{font-family:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
text.cap{fill:#5b6b7c}
.edge{stroke:#c3cdd8;stroke-width:1.7;fill:none}
.edge-p{stroke:#c2680f;stroke-width:1.7;fill:none;stroke-dasharray:6 4}
.edge-s{stroke:#a8406f;stroke-width:1.7;fill:none;stroke-dasharray:2 4;stroke-linecap:round}
.edge-o{stroke:#1d6b45;stroke-width:1.8;fill:none}
.band{fill:#eef1f5;stroke:#dde4ec;stroke-width:1}
</style>
<rect x="0" y="0" width="1200" height="830" fill="#ffffff"/>

    <defs>
      <marker id="b" markerWidth="9" markerHeight="7" refX="8.4" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#c3cdd8"/></marker>
      <marker id="bp" markerWidth="9" markerHeight="7" refX="8.4" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#c2680f"/></marker>
      <marker id="bs" markerWidth="9" markerHeight="7" refX="8.4" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#a8406f"/></marker>
    </defs>

    <rect x="20" y="20" width="150" height="44" rx="6" fill="#e8e4ef" stroke="#4a4458" stroke-width="1.5"/>
    <text class="m" x="95" y="47" font-size="12.5" text-anchor="middle">MQTT :8883</text>
    <rect x="190" y="20" width="150" height="44" rx="6" fill="#e8e4ef" stroke="#4a4458" stroke-width="1.5"/>
    <text class="m" x="265" y="47" font-size="12.5" text-anchor="middle">REST / HTTPS</text>
    <rect x="1040" y="20" width="150" height="44" rx="6" fill="#e8e4ef" stroke="#4a4458" stroke-width="1.5"/>
    <text class="m" x="1115" y="47" font-size="12" text-anchor="middle">feeds.simovi.org</text>

    <rect x="20" y="92" width="1000" height="42" rx="6" fill="#eef1f5" stroke="#c3cdd8" stroke-width="1.5" stroke-dasharray="5 4"/>
