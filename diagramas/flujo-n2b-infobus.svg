<text x="42" y="731" font-size="13" class="cap">Servicio de aplicación</text>
<rect x="224" y="719" width="14" height="14" rx="3" fill="#d7eaf4" stroke="#0b6e99" stroke-width="1.5"/>
<text x="246" y="731" font-size="13" class="cap">Estado / persistencia</text>
<rect x="421" y="719" width="14" height="14" rx="3" fill="#fbead6" stroke="#c2680f" stroke-width="1.5"/>
<text x="443" y="731" font-size="13" class="cap">Sondas de Zabbix</text>
<rect x="582" y="719" width="14" height="14" rx="3" fill="#f6e0ea" stroke="#a8406f" stroke-width="1.5"/>
<text x="604" y="731" font-size="13" class="cap">Agente de Wazuh</text>
<rect x="736" y="719" width="14" height="14" rx="3" fill="#e8e4ef" stroke="#4a4458" stroke-width="1.5"/>
