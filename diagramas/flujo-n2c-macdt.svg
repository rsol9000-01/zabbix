<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-label="Cadena de ítems desde las sondas hasta la macro del umbral">
<title>Nivel 2C — R4 · cadena MACDT</title>
<style>
text{font-family:'IBM Plex Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#17202a}
text.m{font-family:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
text.cap{fill:#5b6b7c}
.edge{stroke:#c3cdd8;stroke-width:1.7;fill:none}
.edge-p{stroke:#c2680f;stroke-width:1.7;fill:none;stroke-dasharray:6 4}
.edge-s{stroke:#a8406f;stroke-width:1.7;fill:none;stroke-dasharray:2 4;stroke-linecap:round}
.edge-o{stroke:#1d6b45;stroke-width:1.8;fill:none}
.band{fill:#eef1f5;stroke:#dde4ec;stroke-width:1}
</style>
<rect x="0" y="0" width="1200" height="560" fill="#ffffff"/>

    <defs>
      <marker id="d" markerWidth="9" markerHeight="7" refX="8.4" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#c3cdd8"/></marker>
      <marker id="do" markerWidth="9" markerHeight="7" refX="8.4" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#1d6b45"/></marker>
    </defs>
    <text class="m cap" x="20" y="28" font-size="11" letter-spacing="1.4">SONDA MAESTRA</text>
    <text class="m cap" x="270" y="28" font-size="11" letter-spacing="1.4">DEPENDIENTE CLAVE</text>
    <text class="m cap" x="540" y="28" font-size="11" letter-spacing="1.4">CALCULADO EN ZABBIX</text>
    <text class="m cap" x="820" y="28" font-size="11" letter-spacing="1.4">EFECTOR</text>
    <text class="m cap" x="1030" y="28" font-size="11" letter-spacing="1.4">SALIDA</text>

    <!-- maestros -->
    <g>
      <rect x="20" y="50" width="200" height="52" rx="6" fill="#fbead6" stroke="#c2680f" stroke-width="2"/>
      <text class="m" x="120" y="72" font-size="12.5" font-weight="700" text-anchor="middle" fill="#a14e07">gtfs.probe</text>
      <text class="m cap" x="120" y="89" font-size="10.5" text-anchor="middle">R3 · 20 dependientes</text>
      <rect x="20" y="118" width="200" height="52" rx="6" fill="#fbead6" stroke="#c2680f" stroke-width="2"/>
      <text class="m" x="120" y="140" font-size="12.5" font-weight="700" text-anchor="middle" fill="#a14e07">macdt.window</text>
      <text class="m cap" x="120" y="157" font-size="10.5" text-anchor="middle">R3 · 10 dependientes</text>
      <rect x="20" y="186" width="200" height="52" rx="6" fill="#fbead6" stroke="#c2680f" stroke-width="2"/>
      <text class="m" x="120" y="208" font-size="12.5" font-weight="700" text-anchor="middle" fill="#a14e07">databus.static</text>
      <text class="m cap" x="120" y="225" font-size="10.5" text-anchor="middle">R3 · 3 dependientes</text>
      <rect x="20" y="270" width="200" height="52" rx="6" fill="#fbead6" stroke="#c2680f" stroke-width="2"/>
      <text class="m" x="120" y="292" font-size="12.5" font-weight="700" text-anchor="middle" fill="#a14e07">infobus.api</text>
      <text class="m cap" x="120" y="309" font-size="10.5" text-anchor="middle">R2 · 19 dependientes</text>
      <rect x="20" y="354" width="200" height="52" rx="6" fill="#fbead6" stroke="#c2680f" stroke-width="2"/>
      <text class="m" x="120" y="376" font-size="12.5" font-weight="700" text-anchor="middle" fill="#a14e07">infobus.api.ext</text>
      <text class="m cap" x="120" y="393" font-size="10.5" text-anchor="middle">R4 · 9 dependientes</text>
    </g>

    <!-- dependientes -->
    <g font-size="11">
      <rect x="270" y="50" width="210" height="26" rx="4" fill="#d7eaf4" stroke="#0b6e99"/><text class="m" x="282" y="67">gtfs.v_trips</text>
      <rect x="270" y="82" width="210" height="26" rx="4" fill="#d7eaf4" stroke="#0b6e99"/><text class="m" x="282" y="99">gtfs.v_gps_pct</text>
      <rect x="270" y="114" width="210" height="26" rx="4" fill="#d7eaf4" stroke="#0b6e99"/><text class="m" x="282" y="131">macdt.v_trips_max</text>
      <rect x="270" y="144" width="210" height="26" rx="4" fill="#d7eaf4" stroke="#0b6e99"/><text class="m" x="282" y="161">macdt.gate</text>
      <rect x="270" y="174" width="210" height="26" rx="4" fill="#ffffff" stroke="#c3cdd8"/><text class="m" x="282" y="191">macdt.static_zip_age_s</text>
      <rect x="270" y="206" width="210" height="26" rx="4" fill="#ffffff" stroke="#c3cdd8"/><text class="m" x="282" y="223">databus.static.age_s</text>
      <rect x="270" y="262" width="210" height="26" rx="4" fill="#d7eaf4" stroke="#0b6e99"/><text class="m" x="282" y="279">infobus.api.llegadas</text>
      <rect x="270" y="292" width="210" height="26" rx="4" fill="#d7eaf4" stroke="#0b6e99"/><text class="m" x="282" y="309">infobus.api.lat_p50</text>
      <rect x="270" y="322" width="210" height="26" rx="4" fill="#ffffff" stroke="#c3cdd8"/><text class="m" x="282" y="339">infobus.api.health_ms</text>
      <rect x="270" y="354" width="210" height="26" rx="4" fill="#ffffff" stroke="#c3cdd8"/><text class="m" x="282" y="371">….ext.health_ms</text>
      <rect x="270" y="384" width="210" height="26" rx="4" fill="#ffffff" stroke="#c3cdd8"/><text class="m" x="282" y="401">….ext.tcp_connect_ms</text>
    </g>
    <path class="edge" d="M220 76 H245 V63 H270" marker-end="url(#d)"/>
    <path class="edge" d="M245 76 V95 H270" marker-end="url(#d)"/>
    <path class="edge" d="M220 144 H245 V127 H270" marker-end="url(#d)"/>
    <path class="edge" d="M245 144 V157 H270" marker-end="url(#d)"/>
    <path class="edge" d="M245 157 V187 H270" marker-end="url(#d)"/>
    <path class="edge" d="M220 212 H245 V219 H270" marker-end="url(#d)"/>
    <path class="edge" d="M220 296 H245 V275 H270" marker-end="url(#d)"/>
    <path class="edge" d="M245 296 V305 H270" marker-end="url(#d)"/>
    <path class="edge" d="M245 305 V335 H270" marker-end="url(#d)"/>
    <path class="edge" d="M220 380 H245 V367 H270" marker-end="url(#d)"/>
    <path class="edge" d="M245 380 V397 H270" marker-end="url(#d)"/>

    <!-- calculados -->
    <g>
      <rect x="540" y="46" width="220" height="42" rx="6" fill="#d9efe3" stroke="#1d6b45" stroke-width="1.6"/>
      <text class="m" x="552" y="63" font-size="11.5" font-weight="700" fill="#1d6b45">p.calculated · ρ</text>
      <text class="m cap" x="552" y="79" font-size="10">min(v_trips ÷ v_trips_max, 1,2)</text>
      <rect x="540" y="176" width="220" height="42" rx="6" fill="#d9efe3" stroke="#1d6b45" stroke-width="1.6"/>
      <text class="m" x="552" y="193" font-size="11.5" font-weight="700" fill="#1d6b45">databus.static.desfase_s</text>
      <text class="m cap" x="552" y="209" font-size="10">age_s − static_zip_age_s</text>
      <rect x="540" y="254" width="220" height="42" rx="6" fill="#d9efe3" stroke="#1d6b45" stroke-width="1.6"/>
      <text class="m" x="552" y="271" font-size="11.5" font-weight="700" fill="#1d6b45">llegadas_p95_1h · N(t)</text>
      <text class="m cap" x="552" y="287" font-size="10">p95 de llegadas en 1 h</text>
      <rect x="540" y="302" width="220" height="42" rx="6" fill="#d9efe3" stroke="#1d6b45" stroke-width="1.6"/>
      <text class="m" x="552" y="319" font-size="11.5" font-weight="700" fill="#1d6b45">lat_p95_1h · L_api</text>
      <text class="m cap" x="552" y="335" font-size="10">p95 de lat_p50 en 1 h</text>
      <rect x="540" y="350" width="220" height="42" rx="6" fill="#d9efe3" stroke="#1d6b45" stroke-width="1.6"/>
      <text class="m" x="552" y="367" font-size="11.5" font-weight="700" fill="#1d6b45">net.delta_ms</text>
      <text class="m cap" x="552" y="383" font-size="10">externo − interno, 15 min</text>
      <rect x="540" y="398" width="220" height="42" rx="6" fill="#d9efe3" stroke="#1d6b45" stroke-width="1.6"/>
      <text class="m" x="552" y="415" font-size="11.5" font-weight="700" fill="#1d6b45">net.rtt_ms · tls_traefik_ms</text>
      <text class="m cap" x="552" y="431" font-size="10">red sola · TLS + Traefik</text>
    </g>
    <path class="edge" d="M480 63 H540" marker-end="url(#d)"/>
    <path class="edge" d="M480 127 H510 V76 H540" marker-end="url(#d)"/>
    <path class="edge" d="M480 187 H540" marker-end="url(#d)"/>
    <path class="edge" d="M480 219 H510 V206 H540" marker-end="url(#d)"/>
    <path class="edge" d="M480 275 H540" marker-end="url(#d)"/>
    <path class="edge" d="M480 305 H510 V318 H540" marker-end="url(#d)"/>
    <path class="edge" d="M480 335 H500 V364 H540" marker-end="url(#d)"/>
    <path class="edge" d="M480 367 H520 V376 H540" marker-end="url(#d)"/>
    <path class="edge" d="M480 397 H510 V414 H540" marker-end="url(#d)"/>

    <!-- macdt-loop -->
    <rect x="820" y="120" width="180" height="200" rx="8" fill="#d9efe3" stroke="#1d6b45" stroke-width="2.2"/>
    <text class="m" x="910" y="144" font-size="13" font-weight="700" text-anchor="middle" fill="#1d6b45">macdt-loop</text>
    <text class="m cap" x="910" y="162" font-size="10.5" text-anchor="middle">cada 60 s · MAPE-K</text>
    <text class="m" x="834" y="190" font-size="10.5">T_base = b + m·N + δ</text>
    <text class="m" x="834" y="208" font-size="10.5">× (1 + β·ρ)</text>
    <text class="m" x="834" y="226" font-size="10.5">× F_crit</text>
    <text class="m" x="834" y="244" font-size="10.5">clamp 91 … 200 ms</text>
    <text class="m cap" x="834" y="270" font-size="10">F_crit 0,7: V_gps &lt; 70 %</text>
    <text class="m cap" x="834" y="284" font-size="10">3 ciclos, gate = 1</text>
    <text class="m cap" x="834" y="304" font-size="10">dato &gt; 180 s: se ignora</text>

    <path class="edge-o" d="M760 66 H790 V150 H820" marker-end="url(#do)"/>
    <path class="edge" d="M480 95 H520 V108 H800 V180 H820" marker-end="url(#d)"/>
    <path class="edge" d="M480 157 H820" marker-end="url(#d)"/>
    <path class="edge-o" d="M760 274 H820" marker-end="url(#do)"/>

    <!-- salida -->
    <rect x="1030" y="60" width="150" height="50" rx="6" fill="#eef1f5" stroke="#c3cdd8" stroke-width="1.4"/>
    <text class="m" x="1105" y="80" font-size="11.5" font-weight="600" text-anchor="middle">trappers macdt.*</text>
    <text class="m cap" x="1105" y="97" font-size="10" text-anchor="middle">status · t_warn · t_base</text>
    <rect x="1030" y="150" width="150" height="60" rx="6" fill="#d7eaf4" stroke="#0b6e99" stroke-width="2"/>
    <text class="m" x="1105" y="175" font-size="11.5" font-weight="700" text-anchor="middle">{$T_LATENCY_WARN}</text>
    <text class="m cap" x="1105" y="194" font-size="10" text-anchor="middle">macro de Infobus-host</text>
    <rect x="1030" y="240" width="150" height="80" rx="6" fill="#ffffff" stroke="#c3cdd8" stroke-width="1.6"/>
    <text class="m" x="1105" y="262" font-size="11.5" font-weight="700" text-anchor="middle">alertas L_api</text>
    <text class="m cap" x="1105" y="282" font-size="10" text-anchor="middle">p95 &gt; T_warn · 30 min</text>
    <text class="m cap" x="1105" y="300" font-size="10" text-anchor="middle">p95 &gt; 200 ms · RNF</text>
    <path class="edge-o" d="M1000 140 H1015 V85 H1030" marker-end="url(#do)"/>
    <path class="edge-o" d="M1000 180 H1030" marker-end="url(#do)"/>
    <path class="edge-o" d="M1105 210 V240" marker-end="url(#do)"/>
    <path class="edge" d="M760 322 H800 V340 H1010 V300 H1030" marker-end="url(#d)"/>

    <!-- pendiente -->
    <rect x="820" y="360" width="180" height="72" rx="6" fill="#fbf0d4" stroke="#8a5a00" stroke-width="1.8" stroke-dasharray="5 4"/>
    <text class="m" x="910" y="382" font-size="11" font-weight="700" text-anchor="middle" fill="#8a5a00">por construir</text>
    <text class="m cap" x="910" y="400" font-size="10" text-anchor="middle">v_gps_cobertura_pct</text>
    <text class="m cap" x="910" y="416" font-size="10" text-anchor="middle">frescos ÷ v_trips_max</text>

    <rect x="540" y="456" width="640" height="40" rx="6" fill="#eef1f5" stroke="#dde4ec"/>
    <text class="m cap" x="556" y="481" font-size="10.5">--calibrate: b, m, δ y β por regresión · 7 días · R² ≥ 0,8 · ≥ 300 puntos · deriva ≤ 25 %</text>
  
<line x1="0" y1="510" x2="1200" y2="510" stroke="#dde4ec"/>
<rect x="0" y="510" width="1200" height="50" fill="#eef1f5"/>
<rect x="20" y="529" width="14" height="14" rx="3" fill="#fbead6" stroke="#c2680f" stroke-width="1.5"/>
